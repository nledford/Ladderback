[workspace]
resolver = "3"
members = [
    "crates/domain",
    "crates/app",
    "crates/api",
    "crates/l10n",
    "crates/web",
    "crates/adapters/engine",
    "crates/adapters/http",
    "crates/adapters/platform",
    "crates/adapters/secrets",
    "crates/adapters/store",
    "crates/testkit",
]
# `web` only builds for wasm32 with trunk; host commands skip it unless asked.
default-members = [
    ".",
    "crates/domain",
    "crates/app",
    "crates/api",
    "crates/l10n",
    "crates/adapters/engine",
    "crates/adapters/http",
    "crates/adapters/platform",
    "crates/adapters/secrets",
    "crates/adapters/store",
    "crates/testkit",
]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.91"
license = "MIT OR Apache-2.0"
repository = "https://github.com/nledford/Steading"
publish = false

[workspace.dependencies]
domain = { path = "crates/domain" }
app = { path = "crates/app" }
api = { path = "crates/api" }
l10n = { path = "crates/l10n" }
engine = { path = "crates/adapters/engine" }
http-adapter = { path = "crates/adapters/http" }
platform = { path = "crates/adapters/platform" }
secrets = { path = "crates/adapters/secrets" }
store = { path = "crates/adapters/store" }
testkit = { path = "crates/testkit" }

async-trait = "0.1.92"
axum = "0.8.9"
clap = { version = "4.6.7", features = ["derive"] }
console_error_panic_hook = "0.1.7"
cucumber = "0.23.0"
env_logger = { version = "0.11.11", default-features = false, features = ["auto-color", "humantime"] }
fluent-bundle = "0.16.0"
# Not 0.14: it negotiates `icu_locid` identifiers, which `unic-langid`, and so
# Fluent's bundles, can't take.
fluent-langneg = "0.13.1"
fluent-syntax = "0.12.0"
futures = "0.3.34"
http-body-util = "0.1.5"
jiff = { version = "0.2.40", features = ["serde"] }
keyring = { version = "3.6.3", default-features = false }
leptos = { version = "0.8.23", features = ["csr"] }
log = "0.4.35"
mime_guess = "2.0.5"
nix = { version = "0.31.3", default-features = false, features = ["signal"] }
proc-macro2 = "1.0.107"
rust-embed = "8.13.0"
# One git revision of rustic's `main`, because `Progress::error` is unreleased
# (technical design §2.1). The `engine` crate depends on them, and so do the
# root tests, which initialize scratch repositories and list their snapshots.
rustic_backend = { git = "https://github.com/rustic-rs/rustic_core", rev = "01fe284ac43d34bde9334210bcd40f824a0d8c69" }
rustic_core = { git = "https://github.com/rustic-rs/rustic_core", rev = "01fe284ac43d34bde9334210bcd40f824a0d8c69" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
shell-words = "1.1.1"
signal-hook = "0.4.6"
# 0.9 needs rustc 1.94; the workspace's MSRV is 1.91 (technical design §8.2).
# No `any`, `json` or TLS: the store is SQLite only. `migrate!` is a macro.
sqlx = { version = "0.8.6", default-features = false, features = ["runtime-tokio", "sqlite", "migrate", "macros"] }
tempfile = "3.27.0"
tokio = "1.54.1"
tower = "0.5.3"
unic-langid = { version = "0.9.6", features = ["macros"] }
url = "2.5.8"
uuid = { version = "1.29.1", features = ["serde"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

# Every test that opens a repository derives its key with scrypt, and
# rustic encrypts and compresses every blob; unoptimized, these dominate
# test time. Only these crates are optimized, so debugging Steading's own
# code is unaffected.
[profile.dev.package.scrypt]
opt-level = 3
[profile.dev.package.salsa20]
opt-level = 3
[profile.dev.package.pbkdf2]
opt-level = 3
[profile.dev.package.sha2]
opt-level = 3
[profile.dev.package.aes]
opt-level = 3
[profile.dev.package.ctr]
opt-level = 3
[profile.dev.package.poly1305]
opt-level = 3
[profile.dev.package.aes256ctr_poly1305aes]
opt-level = 3
[profile.dev.package.zstd-sys]
opt-level = 3

# Build scripts, proc macros and their dependencies get no debug info, whatever
# else a build contains. Left implicit, Cargo gives them the target crates'
# debug info when the build also contains a target crate that needs the same
# dependency, so a proc macro's dependencies hash differently for each set of
# units a command asks for. `cargo test --doc` then rebuilt every proc macro,
# and everything built with one, after `cargo nextest` had built them.
[profile.dev.build-override]
debug = false

[package]
name = "steading"
description = "Self-hosted backup manager for rustic"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[[test]]
name = "e2e"
harness = false

[dependencies]
engine.workspace = true
http-adapter.workspace = true
axum.workspace = true
clap.workspace = true
env_logger.workspace = true
log.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "net", "signal"] }

[dev-dependencies]
app = { workspace = true, features = ["fakes"] }
async-trait.workspace = true
cucumber.workspace = true
domain.workspace = true
futures.workspace = true
log.workspace = true
platform.workspace = true
rustic_backend.workspace = true
rustic_core.workspace = true
secrets.workspace = true
store.workspace = true
tempfile.workspace = true
testkit.workspace = true
tokio = { workspace = true, features = ["time"] }

[lints]
workspace = true
