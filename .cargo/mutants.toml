# cargo mutants (technical design §13.1).
# The contract suites are test code compiled into `app` behind the `fakes`
# feature; mutating their assertions measures nothing.
#
# `crates/l10n/src/browser.rs` (the browser `Intl` host) compiles only for
# wasm32 with `browser-intl`, so on the host every mutant of it builds and
# "survives" without the code ever running. Its tests run in `just test-wasm`
# (CI lane: #46); a wasm32 mutants run is done by hand when it changes:
# `CARGO_BUILD_TARGET=wasm32-unknown-unknown`, with the runner `just test-wasm`
# sets, `cargo mutants -p l10n --features browser-intl --file <it>`.
#
# The `web` crate's DOM glue (`main.rs`, `components.rs`, `live.rs`,
# `page.rs`, `gallery.rs`) calls `web-sys`, which only works in a browser: on
# the host every mutant of it builds and "survives" without the code ever
# running, and a mutant that panics on the host is caught for the wrong
# reason. The `@ui` scenarios of `features/ui/` run it in Chromium
# (`just test-ui`). What decides anything on the host stays covered: the
# announcer's timing (`announcer.rs`), the page titles (`routes.rs`), the
# focus wrap (`focus.rs`) and the toast's arrival and lifetime (`toast.rs`).
exclude_globs = [
    "crates/app/src/contract/**",
    "crates/l10n/src/browser.rs",
    "crates/web/src/components.rs",
    "crates/web/src/live.rs",
    "crates/web/src/page.rs",
    "crates/web/src/gallery.rs",
]
# Core error types implement Display only because `Error` requires it; they
# carry codes and values, and adapters render them (technical design §8.4).
exclude_re = ["<impl std::fmt::Display for "]
# A mutant that makes a test hang is caught, but slowly; fail fast instead.
timeout_multiplier = 3.0
# Skip gitignored files when copying the tree (off by default since
# cargo-mutants 25.0.2): otherwise each job's copy would include every agent
# worktree under .worktrees/ and its build output.
gitignore = true
