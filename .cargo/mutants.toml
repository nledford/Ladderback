# cargo mutants (technical design §13.1).
# The contract suites are test code compiled into `app` behind the `fakes`
# feature; mutating their assertions measures nothing.
#
# `crates/l10n/src/browser.rs` (the browser `Intl` host) compiles only for
# wasm32 with `browser-intl`, so on the host every mutant of it builds and
# "survives" without the code ever running. Its tests run in `just test-wasm`
# (CI lane: #46); a wasm32 mutants run is done by hand when it changes:
# `CARGO_BUILD_TARGET=wasm32-unknown-unknown`, with the runner `just test-wasm`
# sets, `env -u CARGO_TARGET_DIR -u CARGO_BUILD_TARGET_DIR cargo mutants -p l10n
# --features browser-intl --file <it>` (unset as the `mutants` recipe does,
# technical design §13.5).
#
# The `web` crate's DOM glue (`components.rs`, `live.rs`, `page.rs`,
# `gallery.rs`, `ws.rs`) and the `main` of `main.rs` (the rest of that file is
# host code, so `main` is left out by name below) call `web-sys`, which only
# works in a browser: on the host every mutant of it builds and "survives"
# without the code ever running, and a mutant that panics on the host is caught
# for the wrong reason. The `@ui` scenarios of `features/ui/` run it in Chromium
# (`just test-ui`). What decides anything on the host stays covered: the
# announcer's timing (`announcer.rs`), the page titles (`routes.rs`), the
# focus wrap (`focus.rs`), the toast's arrival and lifetime (`toast.rs`) and
# the live pages' state, event application, merge and back-off
# (`backend.rs`), with the events URL and the statuses a run ends with.
# `ws.rs` is only the glue around them: the fetch and WebSocket calls whose
# results the journeys check, and the settle-poll's budget; every decision
# a settle or a reconnect makes on those results lives in `backend.rs`.
#
# `crates/web/src/snapshots.rs` is the same kind of glue, for the Snapshots
# page, and only this stays in it: sending the history read, the previews, the
# starts and the cancel; doing what `maintenance::Panel` decides (`Page::act`:
# say it, open or close the review, read the history again, wait for the run,
# move focus); and drawing the elements, which includes leaving out what has
# nothing to say (an unmanaged group's paths when it has none, the sentence
# that no plan could adopt it when it has no plan to offer, and the
# maintenance and adoption buttons of a repository the daemon says this agent
# does not maintain, with the sentence that says why in their place); and
# reading the offset of the viewer's clock from the browser's `Date`
# (`viewer_offset`, which `formatting.rs` tests in `just test-wasm`). The
# maintenance journeys of `features/ui/maintenance.feature` check it in
# Chromium. Everything the page
# decides is decided on the host and mutated there: the request and the review
# of a preview, the rows, the adoptions, what shows of the history, what the
# page holds while a request is out or a run goes on and what it does next,
# the refusals that read the history again, whether the daemon is called
# unreachable, and the pace and patience of the wait for a run
# (`maintenance.rs`), and the message and arguments of every sentence
# (`wording.rs`).
#
# The wasm32-only test modules of `web` (`formatting.rs`, `time_zones.rs`) are
# not listed: they are declared `#[cfg(test)]`, which cargo-mutants skips (see
# `main.rs`), and their tests run in `just test-wasm`.
exclude_globs = [
    "crates/app/src/contract/**",
    "crates/l10n/src/browser.rs",
    "crates/web/src/components.rs",
    "crates/web/src/live.rs",
    "crates/web/src/page.rs",
    "crates/web/src/gallery.rs",
    "crates/web/src/ws.rs",
    "crates/web/src/snapshots.rs",
]
# Mutants that no test can tell from the real code, or that no host can run:
exclude_re = [
    # Core error types implement Display only because `Error` requires it; they
    # carry codes and values, and adapters render them (technical design §8.4).
    "<impl std::fmt::Display for ",
    # `web`'s `main` mounts the app into the page's `#app` through `web-sys`,
    # which only works in a browser: on the host the mutant builds and nothing
    # calls `main`. The `@ui` scenarios run it in Chromium, where a `main` that
    # mounts nothing leaves them nothing to drive.
    'crates/web/src/main\.rs.*: replace main with \(\)$',
    # `hooks`' `READ_CHUNK` is the size of the buffer one read of a hook's pipe
    # fills: it changes how many reads a stream takes, not what is kept of it
    # nor whether it is marked cut, so no test can tell `8 * 1024` from
    # `8 + 1024`. The size that matters, none (`8 / 1024` is 0, so nothing is
    # ever read), is not excluded and is caught.
    'crates/adapters/hooks/src/lib\.rs.*: replace \* with \+$',
    # `O_NONBLOCK` and `O_NOCTTY` are separate bits, so `|` and `^` give the
    # same flags. `&` (no flags, so opening a FIFO blocks) is caught.
    'crates/adapters/secrets/src/file\.rs.*: replace \| with \^ in read$',
    # `Os::get` is the call to the session's own store (the macOS keychain,
    # the Secret Service); what its errors become is `failure`, which is
    # tested. Its test, `the_os_keyring_keeps_and_gives_back_a_secret`,
    # writes to that store, so it runs only when LADDERBACK_TEST_OS_KEYRING=1
    # asks for it, which a mutation run does not. Every other test reads a
    # keyring held in memory.
    'crates/adapters/secrets/src/keyring_store\.rs.*: replace <impl KeyringStore for Os>::get ',
    # Compiled only where there is no OS keyring (neither macOS nor Linux): on
    # the hosts that run mutants the mutant builds and nothing calls it.
    'crates/adapters/secrets/src/keyring_store\.rs.*: replace <impl KeyringStore for Unavailable>::get ',
]
# A mutant that makes a test hang is caught, but slowly; fail fast instead.
timeout_multiplier = 3.0
# Skip gitignored files when copying the tree (off by default since
# cargo-mutants 25.0.2): otherwise each job's copy would include every agent
# worktree under .worktrees/ and its build output.
gitignore = true
