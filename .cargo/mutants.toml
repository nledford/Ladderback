# cargo mutants (technical design §13.1).
# The contract suites are test code compiled into `app` behind the `fakes`
# feature; mutating their assertions measures nothing.
#
# `crates/l10n/src/browser.rs` (the browser `Intl` host) compiles only for
# wasm32 with `browser-intl`, so on the host every mutant of it builds and
# "survives" without the code ever running. Its tests run in `just test-wasm`
# (CI lane: #46); a wasm32 mutants run is done by hand when it changes:
# `CARGO_BUILD_TARGET=wasm32-unknown-unknown`, with the runner `just test-wasm`
# sets, `env -u CARGO_TARGET_DIR -u CARGO_BUILD_TARGET_DIR cargo mutants -p l10n
# --features browser-intl --file <it>` (unset as the `mutants` recipe does,
# technical design §13.5).
#
# The `web` crate's DOM glue (`components.rs` and each shared component's view,
# `components/*.rs`, one level down only: a component's decisions in
# `components/<name>/rules.rs` are host code and stay mutated; `live.rs`,
# `page.rs`, `gallery.rs` and its demos' `gallery/*.rs`, `ws.rs`) and the
# `main` of `main.rs` (the rest of
# that file is host code, so `main` is left out by name below) call `web-sys`,
# which only works in a browser: on the host every mutant of it builds and
# "survives" without the code ever running, and a mutant that panics on the
# host is caught for the wrong reason. The `@ui` scenarios of `features/ui/`
# run it in Chromium (`just test-ui`). What decides anything on the host stays
# covered: the announcer's timing (`announcer.rs`), the page titles
# (`routes.rs`), the focus wrap (`focus.rs`), the toast's arrival and lifetime
# (`components/toast/rules.rs`) and
# the live pages' state, event application, merge and back-off
# (`backend.rs`), with the events URL and the statuses a run ends with, and
# the end of a page's background work when the reader leaves (`visit.rs`).
# `ws.rs` is only the glue around them: the fetch and WebSocket calls whose
# results the journeys check, and the settle-poll's budget; every decision
# a settle or a reconnect makes on those results lives in `backend.rs`. Its
# session glue (the CSRF token a changed request carries, and a request
# refused for want of a session waiting for the sign-in, then sent again)
# acts on what `session.rs` decides: whether a refusal asks for sign-in.
#
# `crates/web/src/sign_in.rs` is the DOM glue of sign-in (security §10.1):
# the sign-in page, the dialog that asks to sign in again, and the start
# page's notice that sign-in is off. Where the page stands, what a sign-in
# answer means, what the form lacks, whether it offers Keep me signed in and
# whether a sign-in asks to be kept, which refusal is about the field and
# which title the page takes are `session.rs`'s, mutated on the host; the
# `@ui` scenarios of `features/security/sign_in.feature` and
# `features/security/session_length.feature` run the glue in Chromium.
#
# `crates/web/src/settings.rs` is the DOM glue of the Settings page's tabs
# and its API tokens (security §10.1): it draws a tab per section, reads the
# address's fragment as the page opens and whenever it changes, writes the
# chosen tab's, sends the list, create and revoke requests, opens and closes
# the two dialogs, clears a new token's text when its dialog is left, and
# writes the text to the clipboard. Which section a fragment names, which tab
# shown a changed fragment chooses, each section's own and what each panel
# holds are `settings_tabs.rs`'s; what the form lacks, the request it sends,
# which field a refusal is about, how a scope and a last use read and the
# words of each button and dialog are `api_tokens.rs`'s, both mutated on the
# host; the `@ui` scenarios of `features/ui/settings.feature` and
# `features/security/api_tokens.feature` run the glue in Chromium.
#
# `crates/web/src/settings/password.rs` is the DOM glue of Settings' admin
# password section (security §10.1, decision 70): it holds the form's
# signals, reads and clears them, sends the request, shows the error summary
# and takes the steps an answer calls for (forgetting the session, showing
# the sign-in page, reading again what waits for a restart). What the form
# lacks, what it sends, which field a refusal is about, the section's words,
# which steps an answer calls for (also after the reader has left Settings)
# and what Settings says once a password is set are `admin_password.rs`'s,
# mutated on the host; the `@ui` scenarios of
# `features/security/admin_password.feature` run the glue in Chromium.
#
# `crates/web/src/plans_page.rs` is the DOM glue of the Plans page (§4.4,
# decision 96): it sends the list, plan, save and delete requests, holds the
# form's signals and the summary, opens and closes the form and the delete
# dialog, reads the list again while a saved plan waits for its next run,
# and moves focus back to the button that opened the form, or to the page's
# heading when that button is gone. What each field
# shows, the plan a form sends, the plan a new form starts from, which field
# a refusal is about and in whose words, which ID a save's answer names,
# whether a saved plan still waits for its next run and how often and how
# long it is read again, and the words of each button, announcement and
# dialog are `plans.rs`'s, mutated on the host; the `@ui` scenarios of
# `features/ui/plans.feature` run the glue in Chromium.
#
# `crates/web/src/proposals_page.rs` is the DOM glue of the Pending changes
# page (§4.4, decision 89, point 6): it sends the list, review, approve and
# reject requests, holds the list's and the open proposal's signals, says
# each answer, reads the list again once a proposal is decided, and moves
# focus to the open proposal's heading and back to the page's. Which
# proposals it lists, the words of each line, whether Approve is offered and
# the paths and bodies of the requests it sends are `proposals.rs`'s,
# mutated on the host; the `@ui` scenarios of `features/ui/proposals.feature`
# and the page's in `features/ui/buttons.feature` run the glue in Chromium.
#
# `crates/web/src/daemon_log_page.rs` is the DOM glue of the Log page (§4.4,
# #618): it reads the recent log, holds the choice of levels, draws the table
# and copies the lines listed. Which lines a choice lists, the words of a
# choice and of a level and the text a copy puts on the clipboard are
# `daemon_log.rs`'s, mutated on the host; the `@ui` scenarios of
# `features/ui/daemon_log.feature` run the glue in Chromium.
#
# `crates/web/src/settings/sign_in.rs` is the DOM glue of Settings' signing
# in section (security §10.1, decision 70): it reads Stay signed in for,
# holds the choice in a signal, sends the save when its button is pressed,
# opens the dialog that asks before Sign out everywhere and sends it, and
# takes the steps an answer calls for (say it is saved, say a refusal, show
# the sign-in page). The choices, their order, their words, their wire
# names, the request a save sends and which steps an answer calls for (also
# after the reader has left Settings) are `sign_in_settings.rs`'s, and
# whether the sign-in form offers Keep me signed in is `session.rs`'s, both
# mutated on the host; the `@ui` scenarios of
# `features/security/session_length.feature` run the glue in Chromium.
#
# `crates/web/src/settings/language.rs` is the DOM glue of Settings' Language
# section (§8.4, decision 101): it shows the choices, holds the one chosen in
# a signal, keeps it when its button is pressed and says when the browser
# refused. The choices, their order, the one shown chosen and the tag a save
# keeps are `language_choice.rs`'s, mutated on the host; keeping it, the
# reload and focus on the section's heading are `page.rs`'s glue; the `@ui`
# scenarios of `features/ui/language.feature` run both in Chromium.
#
# `crates/web/src/settings/page_width.rs` is the DOM glue of Settings' Page
# width section (§4.5): it shows the choices, keeps each as it is made, sets
# the page's width and, when the browser refused, says so and puts the choice
# back. The choices, their order, what a kept value stands for, what a choice
# keeps and the utilities each width gives `<main>` are `page_width.rs`'s,
# mutated on the host; keeping it is `page.rs`'s glue; the `@ui` scenarios of
# `features/ui/page_width.feature` run both in Chromium, Firefox and WebKit.
#
# `crates/web/src/snapshots.rs` is the same kind of glue, for the Snapshots
# page, and only this stays in it: sending the history read, the previews, the
# starts, the cancel and the stats' look and read; doing what
# `maintenance::Panel` and `stats::StatsPanel` decide (`Page::act`:
# say it, open or close the review, read the history again, wait for the run,
# move focus); and drawing the elements, which includes leaving out what has
# nothing to say (an unmanaged group's paths when it has none, the sentence
# that no plan could adopt it when it has no plan to offer, and the
# maintenance and adoption buttons of a repository the daemon says this agent
# does not maintain, with the sentence that says why in their place); and
# reading the offset of the viewer's clock from the browser's `Date`
# (`viewer_offset`, which `formatting.rs` tests in `just test-wasm`). The
# maintenance journeys of `features/ui/maintenance.feature` and the stats
# journeys of `features/ui/stats.feature` check it in Chromium. Everything
# the page
# decides is decided on the host and mutated there: the request and the review
# of a preview, the rows, the adoptions, what shows of the history, what the
# page holds while a request is out or a run goes on and what it does next,
# the refusals that read the history again, whether the daemon is called
# unreachable, and the pace and patience of the wait for a run
# (`maintenance.rs`), the message and arguments of every sentence
# (`wording.rs`), and the stats' rows, when they were taken and what the
# section holds and says while a read is out (`stats.rs`).
#
# `crates/web/src/snapshot_page.rs` is the DOM glue of a snapshot's page
# (§4.4): it reads the alias and snapshot from the address, sends each read of
# a folder and turns its answer into a page of entries or a refusal's
# sentence, and draws the heading and the tree. The `Tree` component it draws
# is `components/tree.rs`'s glue too. The address of each read (`folder_url`),
# the link to the page (`snapshot_href`), the tree's rows, keys, type-ahead,
# tab stop, pages and refusals are `components/tree/rules.rs`'s, the page's
# title is `routes.rs`'s
# and a refusal's sentence is `refused_sentence`'s, all mutated on the host;
# the `@ui` scenarios of `features/ui/snapshot_browser.feature` and the tree
# scenarios of `features/ui/components/tree.feature` run the glue in Chromium.
#
# `crates/web/src/full_disk_access_warning.rs` is the DOM glue of the start
# page's Full Disk Access warning (§16, decision 115): it reads what the
# agent's probe found, draws the warning, sends Check again and the request
# to open System Settings, says each answer and hands focus to the page's
# heading when the warning goes. Whether it warns, whether it offers the
# settings button, its steps and what each answer says are
# `full_disk_access.rs`'s, mutated on the host; the `@ui` scenarios of
# `features/ui/full_disk_access.feature` run the glue in Chromium.
#
# `crates/web/src/settings/dry_run_allowlist.rs` is the DOM glue of Settings'
# dry-run allowlist section (§16, decision 89, point 13): it sends the read
# and each save, opens and closes the remove and home folder dialogs, says
# each answer, and leaves a press alone while `Allowlist::start` refuses it
# (the `!` of each `if !list.start()`). What each row shows, the list a
# change saves, why a folder typed can't be added, when it warns as the home
# folder does, which refusal is the field's, the words of each button and
# dialog, what the section holds, one save at a time and when the Folder
# field empties are `dry_run_allowlist.rs`'s, mutated on the host; the `@ui`
# scenarios of `features/ui/dry_run_allowlist.feature` run the glue in
# Chromium, Firefox and WebKit ("A folder added by keyboard alone is listed,
# and removing it asks first, starting on Cancel" adds and removes a folder,
# "Adding the home folder warns of what it opens, starting on Cancel, and
# suggests a narrower folder" adds the home folder).
#
# `crates/web/src/settings/machines.rs` is the DOM glue of the Machines tab's
# machines on a hub (§16, decision 121, "Waiting for approval"): it reads the
# list when the tab is built, when the events stream opens and when a hub's
# event asks (#569), draws the waiting and the approved machines' tables,
# says politely that a machine started waiting, opens the review, sends the
# approval and says its answer. What the tables show while live updates are
# paused, what waits and what the resume says are
# `crates/web/src/machines_list.rs`'s, tested
# on the host and gated. What the step-up asks and how it is checked, which
# agent a key approves and each refusal's code are the hub's, tested on the
# host (`crates/adapters/http/src/hub_pages/tests.rs`, `crates/app/src/pairing/`
# and the acceptance scenarios of
# `features/fleet/approving_on_the_hubs_page.feature`); its words are the
# catalog's. The `@ui` scenarios of `features/ui/approving_machines.feature`
# run the glue in Chromium, Firefox and WebKit.
#
# `crates/web/src/dashboard_page.rs` is the DOM glue of the hub's dashboard
# (§4.3, #569): it reads the machines when the page opens, when the events
# stream opens and when an event asks, and draws each machine's section and
# table. Which events read again, what a pause holds and counts, what the
# resume says, how an outcome reads and how a time reads beside the viewer's
# are `crates/web/src/dashboard.rs`'s, tested on the host and gated; the
# machines and their operations are the hub's (`crates/app/src/pairing/hub/`,
# `crates/adapters/http/src/hub_pages/tests.rs`). The `@ui` scenarios of
# `features/ui/hub_dashboard.feature` run the glue in Chromium and WebKit.
#
# The wasm32-only test modules of `web` (`formatting.rs`, `time_zones.rs`) are
# not listed: they are declared `#[cfg(test)]`, which cargo-mutants skips (see
# `main.rs`), and their tests run in `just test-wasm`.
#
# `crates/web/src/settings/agents.rs` is the DOM glue of Settings' Agents
# section on a hub (§16, decision 121, "The hub's dialog"): it reads the
# hub's key and the standing it was read in, sends the make and cancel
# requests, holds the form's and the dialog's signals, shows a token made,
# counts it down on the page's clock, clears its text when it ends or the
# dialog is left, copies it, moves focus to Make a new token, and shows and
# announces what the section says. Whether the daemon is a hub, the
# certificate offered first, whether an address is plain or warned of, what
# a token is asked for, how long it has left and how its lapse reads, the
# life typed, the address a cancel is sent to, which token the dialog shows,
# counts down and may cancel, when the dialog was left and what the section
# says of a cancel once it is closed are `pairing.rs`'s, mutated on the
# host; the `@ui` scenarios of `features/ui/pairing_dialog.feature` run the
# glue in Chromium.
exclude_globs = [
    "crates/app/src/contract/**",
    "crates/l10n/src/browser.rs",
    "crates/web/src/components.rs",
    "crates/web/src/components/*.rs",
    "crates/web/src/live.rs",
    "crates/web/src/page.rs",
    "crates/web/src/gallery.rs",
    "crates/web/src/gallery/*.rs",
    "crates/web/src/ws.rs",
    "crates/web/src/snapshots.rs",
    "crates/web/src/snapshot_page.rs",
    "crates/web/src/sign_in.rs",
    "crates/web/src/settings.rs",
    "crates/web/src/plans_page.rs",
    "crates/web/src/proposals_page.rs",
    "crates/web/src/daemon_log_page.rs",
    "crates/web/src/settings/password.rs",
    "crates/web/src/settings/sign_in.rs",
    "crates/web/src/settings/language.rs",
    "crates/web/src/settings/page_width.rs",
    "crates/web/src/full_disk_access_warning.rs",
    "crates/web/src/settings/dry_run_allowlist.rs",
    "crates/web/src/settings/machines.rs",
    "crates/web/src/dashboard_page.rs",
    "crates/web/src/settings/agents.rs",
]
# Mutants that no test can tell from the real code, or that no host can run:
exclude_re = [
    # Core error types implement Display only because `Error` requires it; they
    # carry codes and values, and adapters render them (technical design §8.4).
    # Named one by one: a value's Display (`ClockOffset`, which writes the
    # offset onto the wire, or `KeyringEntry`) says something a test can check,
    # so its mutants are judged. A new error type joins this list only when its
    # Display is there for `Error` alone.
    "<impl std::fmt::Display for (ClientUnavailable|SessionFailed|ClientError|OpenError|InvalidZone|InvalidOffset|InvalidSnapshot|InvalidOperation|ConfigError|StoreError|ProfileError|ExportRefusal|SourcesError|ResolveError|LifecycleError|KeepDeleteTooShort|ReservedTag|InvalidId|InvalidValue|Violation|NoNextRun|CommandLineError|SecretError|NotAKeyringEntry|TemplateError|DailyCopyError)>",
    # `InvalidZoneName` is such an error too, written `fmt::Display`: the
    # store maps it to its own corrupt-row text and the wire to its refusal,
    # so its Display is there for `Error` alone.
    "<impl fmt::Display for InvalidZoneName>",
    # `web`'s `main` mounts the app into the page's `#app` through `web-sys`,
    # which only works in a browser: on the host the mutant builds and nothing
    # calls `main`. The `@ui` scenarios run it in Chromium, where a `main` that
    # mounts nothing leaves them nothing to drive.
    'crates/web/src/main\.rs.*: replace main with \(\)$',
    # `hooks`' `READ_CHUNK` is the size of the buffer one read of a hook's pipe
    # fills: it changes how many reads a stream takes, not what is kept of it
    # nor whether it is marked cut, so no test can tell `8 * 1024` from
    # `8 + 1024`. The size that matters, none (`8 / 1024` is 0, so nothing is
    # ever read), is not excluded and is caught.
    'crates/adapters/hooks/src/lib\.rs.*: replace \* with \+$',
    # `O_NONBLOCK` and `O_NOCTTY` are separate bits, so `|` and `^` give the
    # same flags. `&` (no flags, so opening a FIFO blocks) is caught.
    'crates/adapters/secrets/src/file\.rs.*: replace \| with \^ in read$',
    # A token's byte is a high hex digit shifted left four bits and a low one
    # below it: the two never share a bit, so `|` and `^` give the same byte.
    # A token that parses to other bytes (`&`) is caught.
    'crates/domain/src/access\.rs.*: replace \| with \^ in Token::parse$',
    # A download ticket's byte is read the same way, a high hex digit shifted
    # left four bits and a low one below it, so `|` and `^` give the same
    # byte. A ticket that parses to other bytes (`&`) is caught.
    'crates/domain/src/restore/download\.rs.*: replace \| with \^ in DownloadTicket::parse$',
    # The hub's fixed keys are read the same way when the build evaluates
    # them (`hex32`), and so is a key file's hex when it is read
    # (`decode_hex32`): a high hex digit shifted left four bits and a low one
    # below it never share a bit, so `|` and `^` give the same byte. Other
    # bytes (`&`) are caught.
    'crates/domain/src/fleet/keys\.rs.*: replace \| with \^ in (hex32|decode_hex32)$',
    # An API token's ID gathers its first eight bytes by shifting what it has
    # eight bits left and joining the next byte below; its secret is read
    # back six bits a character the same way, and the last three characters
    # as `a << 12 | b << 6 | c` with each under 64. The parts joined never
    # share a bit, so `|` and `^` give the same number. Other bits (`&`) are
    # caught.
    'crates/domain/src/access/api_token\.rs.*: replace \| with \^ in (ApiTokenId::from_bytes|PresentedApiToken::parse)$',
    # A proposal's ID gathers its first eight bytes the same way: what it has
    # shifted eight bits left, whose low eight bits are then zero, joined with
    # the next byte, which is under 256. They never share a bit, so `|` and
    # `^` give the same number. Other bits (`&`) are caught.
    'crates/domain/src/planning/proposal\.rs.*: replace \| with \^ in ProposalId::from_bytes$',
    # `HttpNotifier::in_locale` keeps the localizer of the last agent locale
    # it wrote in (for a message's text and its ntfy title), so the catalogs
    # are read once a locale rather than once a message. A guard of `false`
    # builds that same localizer again every time: the text is the same, only
    # slower, so no test can tell it from the cache. A guard of `true` (an old
    # locale's localizer for a new one) is not excluded and is caught.
    'crates/adapters/notify/src/lib\.rs.*: replace match guard held\.0 == \*locale with false in HttpNotifier::in_locale$',
    # `FolderPath::top` is `Self::default()`, the path that names no folder:
    # the mutant that returns `Default::default()` is the same code.
    'crates/domain/src/browse\.rs.*: replace FolderPath::top -> Self with Default::default\(\)$',
    # A proposal's diff walks the table of longest common runs. The walk
    # takes this branch only where `old[i] != new[j]`, the same test the
    # table was filled by, so there `common[i][j]` is
    # `max(common[i + 1][j], common[i][j + 1])`; and `i`, `j` are inside
    # `old` and `new`, so that cell was written. The mutant's `j * 1` asks
    # whether `x = common[i + 1][j]` is at least `max(x, y)`, with
    # `y = common[i][j + 1]`, which holds exactly when `x >= y`: the
    # original's question, so the same branch every time. The other mutants
    # of the walk are not excluded and are caught. Named by line, so a moved
    # line brings the mutant back to judge.
    'crates/app/src/proposals/diff\.rs:174:65: replace \+ with \* in middle$',
    # The fake agent registry's `Keeping` (how long its fake store's write
    # takes) has a Debug only so the registry's derived Debug compiles: no
    # test, contract or scenario prints a fake's internals, and what it
    # writes changes nothing the registry does. Named by line, so a moved
    # line brings the mutant back to judge.
    'crates/app/src/fakes/agent_registry\.rs:36:9: replace <impl fmt::Debug for Keeping>::fmt -> fmt::Result with Ok\(Default::default\(\)\)$',
    # `decoded`'s scratch buffer is `SIGNATURE_BYTES + 3` bytes; the mutant's
    # `SIGNATURE_BYTES * 3` is only larger. The text's length is checked
    # before it is decoded, so every decode fits either buffer and gives the
    # same bytes or the same refusal. Named by line, so a moved line brings
    # the mutant back to judge.
    'crates/app/src/pairing/wire\.rs:658:42: replace \+ with \* in decoded$',
    # `decoded` takes only a text of `(N * 4).div_ceil(3)` characters, and a
    # strict decode of that many characters gives exactly `N` bytes or fails
    # (stray bits are refused), so the guard `length == N` is true whenever
    # the decode succeeds: a guard of `true` takes the same branch every
    # time. Named by line, so a moved line brings the mutant back to judge.
    'crates/app/src/pairing/wire\.rs:660:23: replace match guard length == N with true in decoded$',
    # A token ID's byte is a high hex digit shifted left four bits and a low one
    # below it: the two never share a bit, so `|` and `^` give the same byte.
    # Other bytes (`&`) are caught.
    'crates/domain/src/fleet/fingerprint\.rs.*: replace \| with \^ in TokenId::parse$',
    # `unquoted` returning `Some(...)` for every text makes `parse_pasted`'s
    # `while let Some(unwrapped) = unquoted(inner)` loop forever, so every test
    # that reads a paste (`fleet::token::tests::a_pasted_token_*`) hangs rather
    # than fails: the mutant is caught, only as a timeout no test can turn
    # into a fast failure without a watchdog thread. Named by line, so a moved
    # line brings the mutant back to judge.
    'crates/domain/src/fleet/token\.rs:293:5: replace unquoted -> Option<&str> with Some\(""\)$',
    'crates/domain/src/fleet/token\.rs:293:5: replace unquoted -> Option<&str> with Some\("xyzzy"\)$',
    # `while rest.is_empty()` in `Template::parse` returns at once for any
    # non-empty text (an empty template, which the secrets tests refuse) and
    # loops forever on `""`, which nothing consumes: the tests that parse an
    # empty template hang (`secrets::inline::tests::each_piece_is_where_the_text_writes_it`,
    # `secrets::tests::hostile_rclone_locations_end_without_a_panic`), so the
    # mutant is caught only as a timeout. Named by line, so a moved line brings
    # the mutant back to judge.
    'crates/domain/src/secrets/template\.rs:126:15: delete ! in Template::parse$',
    # `App`'s read of the hub's key drops an answer read in a standing the
    # page has since left. It is a browser effect (`spawn_local`, signals);
    # a guard of `!=` drops every current answer, so a hub never shows its
    # Machines tab, which every `@ui` scenario of
    # `features/ui/approving_machines.feature` opens in Chromium. Named by
    # line, so a moved line brings the mutant back to judge.
    'crates/web/src/main\.rs:448:46: replace == with != in App$',
    # Each page's `paced` takes which shown value is its first load: DOM
    # glue. A test of `!=` hides the page's "Loading…" while it waits, which
    # the `@ui` scenarios check: the operations page's "A page still waiting
    # for the daemon's answer is accessible while it loads"
    # (`features/ui/accessibility.feature`), the repositories page's "The
    # repositories page is accessible while it waits for the daemon's first
    # answer" (`features/ui/repositories.feature`), and the start page's and
    # the AI agents tab's in `features/ui/first_load.feature`. Named by line,
    # so a moved line brings the mutant back to judge.
    'crates/web/src/operations_page\.rs:210:75: replace == with != in Operations$',
    'crates/web/src/repositories_page\.rs:323:68: replace == with != in Repositories$',
    'crates/web/src/start_page\.rs:130:67: replace == with != in Start$',
    'crates/web/src/settings/ai_agents\.rs:162:67: replace == with != in AiAgentsSection$',
    # `panic_report::install` sets a hook that writes through `console.error`,
