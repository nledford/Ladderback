# The red-first check (docs/design/development.md §13.1) in a workflow of its
# own. It depends on a pull request's labels, and a label change must re-run
# this check alone, not every job in ci.yml.
#
# Each run builds the base tree and then the test: commit's tree
# (scripts/red-first.ts). The base tree starts from a copy of the build of main
# that mr boxington (mbx) restored, which ci.yml's `Check (ubuntu-latest)`
# saved (RED_FIRST_SEED), and the test: commit's tree from a copy of the base
# tree's. So only what changed since that build of main compiles again, the
# workspace crates at least: the trees are checked out after the copies, so
# their sources are newer.
name: Red-first

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]

permissions:
  contents: read

# GitHub keeps the latest check run per name and a cancelled run doesn't pass,
# so a run cancelled on the commit being merged blocks the merge (#8: opening a
# pull request with its label sends `opened` and `labeled` together, and one
# run cancelled the other). Only a push (`synchronize`) may cancel: it always
# brings a new head commit, so the cancelled run lands on a commit nobody
# merges. Every other run gets a group of its own (its run ID): sharing one
# group, a queued run would still be cancelled when a newer one queued behind
# it. Duplicate runs on one commit therefore run side by side.
concurrency:
  group: red-first-${{ github.event.pull_request.number }}-${{ github.event.action == 'synchronize' && 'push' || github.run_id }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # Same as ci.yml, see the comment there.
  CARGO_INCREMENTAL: 0
  # This job builds the pull request's first commit and its merge base, whose
  # Cargo.toml can predate the dev profile's line tables (technical design
  # §13.11); without this they would build everything with full debug info.
  # On a tree that has the profile, it changes nothing.
  CARGO_PROFILE_DEV_DEBUG: line-tables-only

jobs:
  red-first:
    # This name is a required status check (ruleset "Protect main"): don't rename it.
    name: Red-first check
    if: github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'behaviour')
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      # Node's version from ui-tests/.nvmrc at the commit this workflow runs,
      # the merge commit, not at the pull request's head checked out below,
      # which may predate the file. Into a folder of its own: the head's
      # checkout then finds no repository at the workspace's root and empties
      # it, this folder with it, before it clones.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          path: node-version
          sparse-checkout: ui-tests/.nvmrc
          sparse-checkout-cone-mode: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: node-version/ui-tests/.nvmrc
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The check reads the PR's own commits, not the merge commit.
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      # Installs the toolchain rust-toolchain.toml names, so mbx keys on it.
      - run: rustup toolchain install
      # A build-cache outage must not fail this required check: with the step
      # allowed to fail, the build runs uncached (slower, still correct), as
      # in ci.yml.
      - uses: jdx/mr-boxington-action@88acf2bb50552c7c508cbac13e5f8c576b95b1de # v1.7.3
        continue-on-error: true
      - uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
        with:
          tool: just,trunk
      # The wasm lane of the check (scripts/red-first.ts) runs a test: commit's
      # new wasm-bindgen tests under Node. The runner must be the version of
      # `wasm-bindgen` that Cargo.lock pins; the wasm32 target comes with the
      # toolchain (rust-toolchain.toml). The binaries are a download of a few
      # seconds, so they are installed always.
      #
      # A Cargo.lock bump to a wasm-bindgen release that the pinned
      # install-action doesn't list (manifests/wasm-bindgen.json at that SHA)
      # doesn't fail the step: the action's `fallback` input defaults to
      # cargo-binstall, so it warns and installs wasm-bindgen-cli at that
      # version through cargo-binstall, from the release's prebuilt binary, or
      # by building it when there is none (slower, still green). Only a
      # version that doesn't exist, or a build that fails, fails the step.
      # Read in the action's main.sh at v2.90.3 (`read_manifest`, and the
      # fallback at its end), and run on macOS arm64, cargo-binstall already
      # installed, with 0.2.130 taken out of the manifest: it fell back and
      # installed in 5 s. On the Linux runner the same path installs
      # cargo-binstall first (read, not run). When bumping the action, check
      # that `fallback` still defaults to cargo-binstall.
      - id: wasm-bindgen
        run: echo "version=$(just _wasm-bindgen-version)" >> "$GITHUB_OUTPUT"
      - uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
        with:
          tool: wasm-bindgen@${{ steps.wasm-bindgen.outputs.version }}
      - run: npm ci
        working-directory: ui-tests
      # `$/`: the action and its script from the commit this workflow runs,
      # the merge commit, not from the pull request's head checked out above,
      # which may predate them.
      - uses: $/.github/actions/chromium
      - run: just red-first "origin/$BASE_REF"
        env:
          BASE_REF: ${{ github.base_ref }}
          RED_FIRST_SEED: target
