# Builds the release archives and the Linux .deb and .rpm packages, and
# smoke-tests them (technical design §12.1, §16 decisions 54 and 123). Each
# archive and package is a run artifact for a few days; the release workflow
# (release.yml) calls this one for the Linux builds of the commit it tags and
# attaches them to the GitHub release. `just release-build` runs cargo-dist's
# `dist build` (dist-workspace.toml) for one target; `just package` builds the
# two packages with nfpm from the binary in that archive, never a rebuild; and
# `just smoke-release` checks the binary in it, and each package, on Linux
# (scripts/smoke-release.ts): in clean containers, Debian 12 and 13, Ubuntu
# 22.04 and 24.04 and Fedora, and on macOS the binary on the runner.
#
# It runs every night, by hand, from release.yml, and on pull requests
# labeled `release`: release-plz labels each release PR so
# (release-plz.toml), and a change that could break a release build
# (dependencies, build settings, features) can be labeled to try it before it
# merges. None of its jobs is a required check, and their names must not match
# one (development.md §13.8).
#
# The Linux builds run on Ubuntu 22.04, so the binary needs no glibc newer
# than 2.35, and the smoke test fails if it does. No build cache: a release
# build starts clean, so nothing a pull request's run wrote can reach it.
name: Release builds

on:
  schedule:
    - cron: "43 4 * * *" # nightly, apart from ci.yml's 03:17
  workflow_dispatch:
  # From release.yml, for the archives a release publishes.
  workflow_call:
    inputs:
      macos-optional:
        description: A failed macOS build doesn't fail the run; a release publishes no macOS archive yet (decision 71)
        type: boolean
        default: false
      tag:
        description: The release tag to build and expect in `--version`, as `vX.Y.Z`
        type: string
        default: ""
  pull_request:
    # Not `opened`: a pull request opened with the `release` label also gets
    # a `labeled` event, and the two runs would cancel each other's builds.
    types: [synchronize, reopened, labeled]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Release archive (${{ matrix.target }})
    # On a pull request, only one labeled `release`; on `labeled`, only when
    # that label is the one just added, so another label doesn't build again.
    if: >-
      github.event_name != 'pull_request'
      || (contains(github.event.pull_request.labels.*.name, 'release')
      && (github.event.action != 'labeled' || github.event.label.name == 'release'))
    # One build of each target per pull request or branch: a push cancels the
    # pull request's older build. On the job, not the workflow, so that a run
    # whose builds are skipped (another label added) cancels nothing. Nightly
    # and manual runs aren't canceled: GitHub keeps one running and one
    # waiting per group, and a newer waiting run replaces the older one. The
    # event is in the group, so a nightly or manual run on main never replaces
    # a release's waiting build (release.yml runs on `push`).
    concurrency:
      group: release-builds-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}-${{ matrix.target }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-22.04
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-22.04-arm
          # arm64 only: dist can't build a universal binary yet (dist #77).
          - target: aarch64-apple-darwin
            os: macos-26
    runs-on: ${{ matrix.os }}
    # A release publishes no macOS archive yet, so its macOS build can't hold
    # back the Linux ones.
    continue-on-error: ${{ inputs.macos-optional == true && matrix.target == 'aarch64-apple-darwin' }}
    timeout-minutes: 60
    env:
      TARGET: ${{ matrix.target }}
      TAG: ${{ inputs.tag }}
    steps:
      # A release's build checks out its tag, which fetches the tag, so the
      # binary names itself as that release (decision 90); otherwise the
      # commit the run is for.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag }}
          persist-credentials: false
      # The toolchain and the wasm32 target rust-toolchain.toml names.
      - run: rustup toolchain install
      # Trunk's pre-build hook installs Tailwind with npm (crates/web/Trunk.toml).
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: ui-tests/.nvmrc
      - uses: taiki-e/install-action@75a7c0f87bd666af3cdb75c5b9e9d03ab6044e6f # v2.90.6
        with:
          tool: just,trunk
      # dist builds with `cargo auditable build` (dist-workspace.toml), so the
      # binary embeds its dependency list. A pinned version, checked against
      # the SHA-256 install-action's manifest records for it; `fallback: none`,
      # so a release missing from that manifest fails the step rather than
      # installing an unchecked build with cargo-binstall.
      - uses: taiki-e/install-action@75a7c0f87bd666af3cdb75c5b9e9d03ab6044e6f # v2.90.6
        with:
          tool: cargo-auditable@0.7.7
          fallback: none
      # trunk runs the wasm-bindgen Cargo.lock pins, and downloads it unless
      # that version is on the PATH. Its aarch64 Linux release is a gnu build
      # that needs GLIBC_2.38, which Ubuntu 22.04 hasn't (install-action
      # installs the same one), so on that runner it is built from source.
      # The other targets' releases run here: musl on x86_64, and macOS.
      - if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: cargo install --locked wasm-bindgen-cli --version "$(just _wasm-bindgen-version)"
      # Not in install-action's list: the official release, checked against
      # the SHA-256 the script pins.
      - run: scripts/install-dist.sh
      # Not in install-action's list either: nfpm, which builds the packages,
      # from its official release, checked against the SHA-256 the script pins.
      # Linux only: the packages are Linux's.
      - if: runner.os == 'Linux'
        run: scripts/install-nfpm.sh
      - run: just release-build "$TARGET"
      # The archive's own checksum, then the binary out of it, as a person
      # downloading it would.
      - name: Unpack the archive
        run: |
          cd target/distrib
          if command -v sha256sum >/dev/null; then sha256sum -c "ladderback-$TARGET.tar.xz.sha256"; else shasum -a 256 -c "ladderback-$TARGET.tar.xz.sha256"; fi
          mkdir -p "$RUNNER_TEMP/release"
          tar -xJf "ladderback-$TARGET.tar.xz" -C "$RUNNER_TEMP/release"
      # The .deb and .rpm of that binary, the one the archive holds and the
      # smoke test checks: nfpm copies it, and nothing rebuilds it. A release's
      # packages carry its tag's version; any other build's, the version its
      # binary names, commit and all (decision 90).
      - name: Build the .deb and .rpm
        if: runner.os == 'Linux'
        run: |
          bin="$RUNNER_TEMP/release/ladderback-$TARGET/ladderback"
          version=${TAG#v}
          if [ -z "$version" ]; then version=$("$bin" --version | cut -d' ' -f2); fi
          just package "$TARGET" "$bin" "$version"
      # Uploaded before the smoke test, so a failing build can be downloaded
      # and looked at. `overwrite`: a rerun's build replaces the failed one's,
      # so a release never publishes an archive or a package whose smoke test
      # failed. The packages are on Linux only; on macOS their patterns match
      # nothing, and the archive's files are enough.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ladderback-${{ matrix.target }}
          path: |
            target/distrib/ladderback-${{ matrix.target }}.tar.xz
            target/distrib/ladderback-${{ matrix.target }}.tar.xz.sha256
            target/distrib/ladderback_*.deb
            target/distrib/ladderback_*.deb.sha256
            target/distrib/ladderback-*.rpm
            target/distrib/ladderback-*.rpm.sha256
            target/distrib/release-build-manifest.json
          if-no-files-found: error
          retention-days: 7
          overwrite: true
      # The section cargo-auditable writes, which `cargo audit bin` reads
      # (decision 54): without it, dist built with plain `cargo build`.
      - name: Check the binary embeds its dependency list
        run: |
          bin="$RUNNER_TEMP/release/ladderback-$TARGET/ladderback"
          if [ "$RUNNER_OS" = macOS ]; then sections=$(otool -l "$bin"); else sections=$(readelf -SW "$bin"); fi
          grep -F .dep-v0 <<<"$sections" || { echo "::error::$bin has no .dep-v0 section, so it was built without cargo-auditable"; exit 1; }
      # A release's binary must say exactly its version, with no commit, and
      # so must each package's (the glob names the one .deb and the one .rpm
      # this run built).
      - if: runner.os == 'Linux'
        run: just smoke-release "$RUNNER_TEMP/release/ladderback-$TARGET/ladderback" --container all --package target/distrib/ladderback_*.deb --package target/distrib/ladderback-*.rpm ${TAG:+--version "${TAG#v}"}
      - if: runner.os == 'macOS'
        run: just smoke-release "$RUNNER_TEMP/release/ladderback-$TARGET/ladderback" ${TAG:+--version "${TAG#v}"}

  # A scheduled run notifies no one, so a failed nightly build opens an issue,
  # or comments on the open one, as ci.yml's nightly jobs do. A job of its own,
  # so only it holds `issues: write`, and the builds, which run a pull
  # request's code, don't.
  report:
    name: Report a failed nightly release build
    needs: build
    if: failure() && github.event_name == 'schedule'
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    # One report at a time, so two failed runs don't both open an issue.
    concurrency:
      group: release-builds-report
      cancel-in-progress: false
    permissions:
      issues: write # to open or comment on the issue; no checkout, so no contents
    steps:
      # `$/`: the action from the commit this workflow runs, with no checkout.
      - uses: $/.github/actions/report-nightly-failure
        with:
          title: Nightly release build failed
          body: "The nightly release build (`just release-build`, `just smoke-release`) failed: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}. Each failed job's summary has the smoke test's table, and its archive is a run artifact."
