# Builds the user docs site (docs/guide/, §16 decision 128), checks it, and
# publishes it to GitHub Pages at https://nledford.github.io/Ladderback/
# (development.md §13.8).
#
# - A pull request that touches the site, or what builds or checks it, runs
#   `just docs-site-a11y`: the build with the mdBook the Justfile pins, the
#   link check, and axe-core over every page. It deploys nothing.
# - A push to main that touches the same paths, and a manual run from main,
#   run the same check, then deploy what it built with GitHub's own Pages
#   actions. A manual run from another branch checks only.
#
# Deploying needs the repository's Pages source set to "GitHub Actions"
# (Settings, Pages), which the maintainer sets once, then runs this workflow
# from main by hand for the first deploy; until then the deploy job fails at
# configure-pages, and nothing is published.
#
# Neither job is a required check, and neither name matches one of the
# required names (development.md §13.8). The workflow saves no cache: it
# restores the npm and Chromium caches ci.yml saves on main, and passes
# `save: "false"` so its own push to main doesn't race ci.yml's saves (ci.yml's
# header comment has the cache design).
name: Docs site

on:
  push:
    branches: [main]
    paths:
      - "docs/guide/**"
      - Justfile
      - scripts/check-site-links.ts
      - scripts/check-theme-override.ts
      - ui-tests/scripts/docs-site-a11y.ts
      - ui-tests/package.json
      - ui-tests/package-lock.json
      - ui-tests/.nvmrc
      - scripts/install-browser.sh
      - ".github/actions/browser/**"
      - ".github/actions/npm-ci/**"
      - .github/workflows/docs-site.yml
  pull_request:
    paths:
      - "docs/guide/**"
      - Justfile
      - scripts/check-site-links.ts
      - scripts/check-theme-override.ts
      - ui-tests/scripts/docs-site-a11y.ts
      - ui-tests/package.json
      - ui-tests/package-lock.json
      - ui-tests/.nvmrc
      - scripts/install-browser.sh
      - ".github/actions/browser/**"
      - ".github/actions/npm-ci/**"
      - .github/workflows/docs-site.yml
  workflow_dispatch:

permissions:
  contents: read

# A new push to a pull request cancels its run in progress; runs on main queue
# instead, so a deploy is never cut short (the deploy job's own group below
# holds across runs).
concurrency:
  group: docs-site-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Docs site (build, links, axe-core)
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: ui-tests/.nvmrc
          package-manager-cache: false
      # mdBook at the version the Justfile pins (its `mdbook_version` line,
      # read before `just` is installed, as ci.yml reads it), and `just`. An
      # empty read fails here rather than install whatever mdBook is newest.
      - id: mdbook
        run: |
          version=$(sed -n 's/^mdbook_version := "\(.*\)"$/\1/p' Justfile)
          test -n "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
        with:
          tool: just,mdbook@${{ steps.mdbook.outputs.version }}
      - uses: $/.github/actions/npm-ci
        with:
          save: "false"
      - uses: $/.github/actions/browser
        with:
          engines: chromium
          save: "false"
      - run: just docs-site-a11y
      # Only what a deploy publishes is uploaded.
      - if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: docs/guide/book

  deploy:
    name: Docs site (deploy to Pages)
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    # The only write access in this workflow: Pages, and the OIDC token
    # deploy-pages proves the run's identity with.
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    # One deploy at a time across runs, and one in progress is never
    # cancelled: a newer run waits, and replaces any run still waiting.
    concurrency:
      group: docs-site-pages
      cancel-in-progress: false
    steps:
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
