# Releases (technical design §12.1).
# - Run this workflow by hand to open or update the release PR, which bumps
#   the workspace version and CHANGELOG.md from the Conventional Commits since
#   the last tag.
# - Merging that PR to main makes the next push run tag `vX.Y.Z` and create
#   the GitHub release, then build the Linux archives and packages of that
#   commit (release-builds.yml) and attach them with a SHA256SUMS file (§16,
#   decisions 54 and 123). Once they are attached, it builds the Docker
#   image of each Linux archive, smoke-tests it (release-image.yml) and
#   publishes the two as one image, `ghcr.io/nledford/ladderback` and
#   `docker.io/nledford/ladderback`, tagged with the version and `latest`
#   (§12, decision 126). Pushes without a release PR merge release nothing.
name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release-pr:
    name: Open or update the release PR
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    # One release-plz run at a time. On these two jobs, not the workflow, so
    # a release's hour of builds doesn't hold back the next push or the
    # release PR: GitHub keeps one waiting run per group and drops older ones.
    concurrency:
      group: release
      cancel-in-progress: false
    # RELEASE_PLZ_TOKEN is a secret of the `release` environment, whose only
    # deployment branch is main. An environment secret reaches only a job
    # that names the environment and runs from a branch it allows, so a
    # workflow edited on another branch can't read the token.
    environment: release
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - run: rustup toolchain install
      - uses: release-plz/action@66b324fd6c72d05d2a08568492ecdd62bfb8a62b # v0.5.148
        with:
          command: release-pr
        env:
          # A PR opened with GITHUB_TOKEN doesn't trigger CI; a fine-grained
          # token in RELEASE_PLZ_TOKEN (contents and pull requests: write) does.
          GITHUB_TOKEN: ${{ secrets.RELEASE_PLZ_TOKEN || secrets.GITHUB_TOKEN }}

  release:
    name: Tag and publish the GitHub release
    if: github.event_name == 'push' && github.repository == 'nledford/Ladderback'
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    concurrency:
      group: release
      cancel-in-progress: false
    permissions:
      contents: write
      pull-requests: read
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - run: rustup toolchain install
      - id: release-plz
        uses: release-plz/action@66b324fd6c72d05d2a08568492ecdd62bfb8a62b # v0.5.148
        with:
          command: release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # The tag of the release just made, for the archives; none when this
      # push released nothing.
      - id: tag
        if: steps.release-plz.outputs.releases_created == 'true'
        env:
          RELEASES: ${{ steps.release-plz.outputs.releases }}
        run: |
          tag=$(jq -r '.[] | select(.package_name == "ladderback") | .tag' <<<"$RELEASES")
          if [ -z "$tag" ]; then echo "::error::release-plz released no ladderback tag: $RELEASES"; exit 1; fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

  # The release's Linux archives: the same builds and smoke test as the
  # nightly run, of the tag just made, whose version the binary must say. macOS is built too, but its
  # archive isn't published until it can be signed (decision 71).
  builds:
    name: Release builds
    needs: release
    if: needs.release.outputs.tag != ''
    permissions:
      contents: read
      # Asked for by release-builds.yml's nightly report job, which a release
      # run skips; a called workflow's jobs may ask for no more than this.
      issues: write
    uses: $/.github/workflows/release-builds.yml
    with:
      macos-optional: true
      tag: ${{ needs.release.outputs.tag }}

  # A job of its own, so only it, which runs none of the build's code, can
  # write to the release. Any of the six files missing fails it: the two
  # archives, and the .deb and .rpm of each (§16 decision 123).
  publish:
    name: Attach the Linux archives to the release
    needs: [release, builds]
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      actions: read # to download this run's artifacts
      contents: write # to upload the release's assets; no checkout
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
      TAG: ${{ needs.release.outputs.tag }}
    steps:
      # Two names, so each artifact gets a folder of its own: both hold a
      # release-build-manifest.json, and gh won't overwrite a file.
      - name: Download the archives and packages
        run: gh run download "$GITHUB_RUN_ID" --name ladderback-x86_64-unknown-linux-gnu --name ladderback-aarch64-unknown-linux-gnu --dir artifacts
      # Each archive and package against the checksum its build wrote, then
      # one SHA256SUMS for all six, which `sha256sum -c` checks after a
      # download. A package's checksum file must be the build's `sha256sum` line
      # for that package and no other file's. A missing file fails here: gh
      # downloads the names it finds without a word about the others, and the
      # names are the ones the tag's version gives (`just package`). The last
      # check is that the folder holds these six and SHA256SUMS, nothing else.
      - name: Write SHA256SUMS
        run: |
          version=${TAG#v}
          mkdir assets
          files=()
          for target in x86_64-unknown-linux-gnu aarch64-unknown-linux-gnu; do
            case $target in
              x86_64-unknown-linux-gnu) deb_arch=amd64 rpm_arch=x86_64 ;;
              aarch64-unknown-linux-gnu) deb_arch=arm64 rpm_arch=aarch64 ;;
            esac
            archive="ladderback-$target.tar.xz"
            deb="ladderback_${version}_$deb_arch.deb"
            rpm="ladderback-${version}-1.$rpm_arch.rpm"
            (
              cd "artifacts/ladderback-$target"
              sha256sum -c "$archive.sha256"
              for package in "$deb" "$rpm"; do
                sha256sum "$package" | diff - "$package.sha256"
              done
            )
            for file in "$archive" "$deb" "$rpm"; do
              mv "artifacts/ladderback-$target/$file" assets/
              files+=("$file")
            done
          done
          cd assets
          sha256sum "${files[@]}" > SHA256SUMS
          sha256sum -c SHA256SUMS
          [ "${#files[@]}" -eq 6 ] || { echo "::error::${#files[@]} files to attach, not 6"; exit 1; }
          [ "$(wc -l < SHA256SUMS)" -eq 6 ] || { echo "::error::SHA256SUMS doesn't list 6 files"; exit 1; }
          [ "$(printf '%s\n' "${files[@]}" SHA256SUMS | sort)" = "$(printf '%s\n' * | sort)" ] || { echo "::error::the folder holds files other than the six and SHA256SUMS"; exit 1; }
      # --clobber, so rerunning a failed run attaches them again. Everything in
      # the folder, which the step above checked holds these files only.
      - name: Attach them to the release
        working-directory: assets
        run: gh release upload "$TAG" --clobber ./*

  # The Docker image of each Linux archive `publish` checked and attached:
  # built on that platform's runner from the release's archive, smoke-tested,
  # and pushed to GHCR by its digest only (release-image.yml). After
  # `publish`, so a failed image never holds back the archives. Two jobs, not
  # a matrix, so each digest is an output of its own.
  image-amd64:
    name: Docker image (linux/amd64)
    needs: [release, builds, publish]
    permissions:
      contents: read # to check out the tag and download its archive
      packages: write # to push the image to GHCR by its digest
    uses: $/.github/workflows/release-image.yml
    with:
      platform: amd64
      tag: ${{ needs.release.outputs.tag }}
      push: true

  image-arm64:
    name: Docker image (linux/arm64)
    needs: [release, builds, publish]
    permissions:
      contents: read # to check out the tag and download its archive
      packages: write # to push the image to GHCR by its digest
    uses: $/.github/workflows/release-image.yml
    with:
      platform: arm64
      tag: ${{ needs.release.outputs.tag }}
      push: true

  # Only once both platforms' images passed their smoke test: one
  # multi-platform image of the two digests, tagged with the version, in each
  # registry, and `latest` too when this release is GitHub's latest one (not a
  # pre-release, nor an older release's run run again). `imagetools create`
  # copies the images from GHCR to Docker Hub, so both registries hold the
  # same digests, and gives the index the image's OCI labels as annotations,
  # which is where both registries read a multi-platform image's description
  # from. A job of its own, so the Docker Hub token reaches only it, which
  # runs none of the repository's code. Run again, it tags the same digests
  # again.
  image:
    name: Publish the Docker image
    needs: [release, image-amd64, image-arm64]
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    # DOCKERHUB_TOKEN is a secret of the `release` environment, as
    # RELEASE_PLZ_TOKEN is (above): only a job from main can read it.
    environment: release
    permissions:
      contents: read # to ask which release is the latest; no checkout
      packages: write # to tag the image in GHCR
    env:
      GH_REPO: ${{ github.repository }}
      TAG: ${{ needs.release.outputs.tag }}
      AMD64: ${{ needs.image-amd64.outputs.digest }}
      ARM64: ${{ needs.image-arm64.outputs.digest }}
      GHCR_IMAGE: ghcr.io/nledford/ladderback
      DOCKERHUB_IMAGE: docker.io/nledford/ladderback
    steps:
      - name: Sign in to both registries
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DOCKERHUB_USERNAME: ${{ vars.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          printf '%s' "$GH_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          printf '%s' "$DOCKERHUB_TOKEN" | docker login docker.io --username "$DOCKERHUB_USERNAME" --password-stdin
      - name: Tag the image in both registries
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          for digest in "$AMD64" "$ARM64"; do
            [[ $digest =~ ^sha256:[0-9a-f]{64}$ ]] || { echo "::error::no image digest: '$digest'"; exit 1; }
          done
          version=${TAG#v}
          tags=("$version")
          latest=$(gh release view --json tagName --jq .tagName)
          if [ "$latest" = "$TAG" ]; then
            tags+=(latest)
          else
            echo "::notice::$TAG isn't the latest release ($latest), so \`latest\` stays where it is"
          fi
          # The image's own labels (Containerfile), so they aren't written twice.
          labels=$(docker buildx imagetools inspect "$GHCR_IMAGE@$AMD64" --format '{{json .Image.Config.Labels}}')
          annotations=()
          for key in title description source documentation licenses version; do
            value=$(jq -r --arg key "org.opencontainers.image.$key" '.[$key] // empty' <<<"$labels")
            if [ -n "$value" ]; then annotations+=(--annotation "index:org.opencontainers.image.$key=$value"); fi
          done
          for image in "$GHCR_IMAGE" "$DOCKERHUB_IMAGE"; do
            args=()
            for tag in "${tags[@]}"; do args+=(--tag "$image:$tag"); done
            docker buildx imagetools create "${args[@]}" "${annotations[@]}" "$GHCR_IMAGE@$AMD64" "$GHCR_IMAGE@$ARM64"
          done
          # Every tag in both registries names one index, and it holds the
          # manifests of the two images pushed (each platform's image and its
          # attestation), nothing else.
          manifests() { docker buildx imagetools inspect "$1" --format '{{json .Manifest}}' | jq -c '[.manifests[].digest] | sort'; }
          expected=$(jq -cn --argjson a "$(manifests "$GHCR_IMAGE@$AMD64")" --argjson b "$(manifests "$GHCR_IMAGE@$ARM64")" '$a + $b | sort')
          index=""
          for image in "$GHCR_IMAGE" "$DOCKERHUB_IMAGE"; do
            for tag in "${tags[@]}"; do
              digest=$(docker buildx imagetools inspect "$image:$tag" --format '{{json .Manifest}}' | jq -r .digest)
              [ -z "$index" ] || [ "$digest" = "$index" ] || { echo "::error::$image:$tag is $digest, not $index"; exit 1; }
              index=$digest
              [ "$(manifests "$image@$digest")" = "$expected" ] || { echo "::error::$image:$tag doesn't hold the two images pushed, $AMD64 and $ARM64"; exit 1; }
              echo "$image:$tag is $digest" >> "$GITHUB_STEP_SUMMARY"
            done
          done
          echo "INDEX=$index" >> "$GITHUB_ENV"
          echo "TAGS=${tags[*]}" >> "$GITHUB_ENV"
      - name: Sign out of both registries
        if: always()
        run: |
          docker logout ghcr.io
          docker logout docker.io
      # What everyone else sees, signed out: a GHCR package starts private,
      # so until the maintainer makes it public once, after the first
      # release's push, this fails, and rerunning this job checks again.
      - name: Check that anyone can pull it
        run: |
          for image in "$GHCR_IMAGE" "$DOCKERHUB_IMAGE"; do
            for tag in $TAGS; do
              digest=$(docker buildx imagetools inspect "$image:$tag" --format '{{json .Manifest}}' | jq -r .digest)
              [ "$digest" = "$INDEX" ] || { echo "::error::signed out, $image:$tag is '$digest', not $INDEX: is the package public?"; exit 1; }
            done
          done
