# Checks the pull request's title (scripts/check-pr-title.ts). The title is
# the squash commit's subject, and release-plz builds the changelog and the
# version bump from it, so it must be a Conventional Commit (AGENTS.md).
#
# A workflow of its own, so that editing a title re-runs this check alone, not
# every job in ci.yml. `synchronize` runs it too, so every head commit has the
# check. Not a required check: the maintainer may add "Pull request title" to
# the ruleset once it has proved stable.
name: PR title

on:
  pull_request:
    types: [opened, edited, reopened, synchronize]

permissions:
  contents: read

jobs:
  title:
    name: Pull request title
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The script, and the Node version every workflow uses.
          sparse-checkout: |
            scripts/check-pr-title.ts
            ui-tests/.nvmrc
          sparse-checkout-cone-mode: false
      # Node runs the TypeScript directly, stripping its types.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: ui-tests/.nvmrc
      # The title is untrusted input, so it reaches the script as an
      # environment variable, never inside the shell text.
      - run: node scripts/check-pr-title.ts "$PR_TITLE"
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
