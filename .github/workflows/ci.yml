# Every job runs the same `just` recipes developers and agents run locally.
# The red-first check is in red-first.yml.
#
# The Actions cache (#727). GitHub keeps 10 GB of it per repository and, past
# that, evicts the least recently used entries, whatever they are; a cold
# `Check (macos-latest)` is the costliest result. A pull request can read its
# own caches and the base branch's, and no other pull request's, so the rules
# below keep exactly the entries every pull request reads, one per family, and
# a footprint that fits with room for a save in flight.
#
# 1. Only a push to main saves a cache. Pull requests restore and never save:
#    mbx saves on a push to the default branch alone, and every other cache
#    (browsers, trunk's tools, npm's) is restored by one step and saved by a
#    second one that runs on a push to main, when the restore missed. Each
#    pull request used to save its own copy of what it restored (a copy of
#    the browsers is 0.3 to 0.5 GB), which no other pull request could read.
# 2. Main saves every set a pull request restores. red-first.yml runs on pull
#    requests alone, so `browser-cache` below installs its engines on main.
# 3. The Rust build doesn't grow. Cargo names each artifact by a hash of what
#    went into it and never deletes one it stops using, and mbx saves what a
#    build leaves and restores it for the next, so a change to a manifest,
#    the lockfile or the toolchain left the old copy of every artifact it
#    touched in the entry for good. Measured on main (2026-11-15): the Linux
#    entry held 2.0 GB for twelve commits, then took 2.8 GB with the commit
#    that changed `web-sys`'s features and two manifests (b856eeb), and 3.8 GB
#    with the next save, which followed ten commits that added the `mcp`
#    crate and dependencies of `domain` (ec58f95). Nearly every crate and test
#    binary is rebuilt under a new hash then: 263 test executables sat in the
#    entry, 86 in a build from nothing, 11.9 of the 15.9 GB it unpacks to. The
#    macOS entry jumped at the same commits, 1.6 to 2.2 to 2.9 GB, and the
#    wasm one held 90 MB over a build from nothing. So `rust-cache`
#    (.github/actions/rust-cache) puts a hash of the manifests, the lockfile
#    and the toolchain file into the cache's key. A push to main restores only
#    an entry with its own hash and otherwise builds from nothing, once per
#    change to those files; a Check run from nothing took about 3 minutes
#    longer than a warm one on Linux (10 to 12 minutes against 7 to 10, on
#    2026-11-14 and 15) and about 4 on macOS. Pull requests prefer their own
#    hash, fall back to the newest entry of any, and never save. Between such
#    changes an entry stays the size of its sources.
# 4. One entry per family, and it goes after its successor is saved. mbx saves
#    in its post step, after a job's last step, so no step of that job can
#    delete what the save replaced. The `cache-prune` job at the end of a
#    push runs after the jobs that save and keeps each family's newest entry
#    (scripts/prune-cache.sh): a failed save leaves the old entry, and a
#    family never has fewer than one. Its `actions: write` is the only one
#    in this file. A save that is still running isn't listed, and a
#    restore that a delete cuts short falls back to a cold build, as a miss
#    does (the mbx steps may fail without failing the job).
# 5. A closed pull request's caches are deleted (cache-cleanup.yml), with
#    `pull_request`, not `pull_request_target`, and not for forks.
#
# Footprint on main, in GB. "Entry" is what one push saves, measured on
# 2026-11-15 (the Rust builds are a build from nothing at this commit, 1.5 GB
# for Linux, rounded up for what a few commits add; the macOS figure is an
# estimate, to be replaced by the first entry saved); "kept" is how many entries
# `cache-prune` leaves; "peak" is one entry more of each, the worst moment:
# every family has saved its successor and `cache-prune` hasn't run. A usual
# push rotates the three Rust builds, and only a change to a lockfile the rest.
#
#   family                           saved by         entry  kept  steady  peak
#   Rust build, Linux                Check (ubuntu)    1.60     1    1.60  3.20
#   Rust build, Linux, wasm32        Wasm tests        0.42     1    0.42  0.84
#   Rust build, macOS (estimated)    Check (macos)     1.30     1    1.30  2.60
#   browsers, chromium               UI journeys       0.31     1    0.31  0.62
#   browsers, three engines          browser-cache     0.51     1    0.51  1.02
#   system packages, chromium        UI journeys       0.02     2    0.04  0.06
#   system packages, three engines   browser-cache     0.14     2    0.28  0.42
#   trunk's tools                    UI journeys       0.01     1    0.01  0.02
#   npm's packages                   Check (ubuntu)    0.02     1    0.02  0.04
#   total                                                           4.49  8.82
#
# The peak leaves 1.2 GB under the limit. At the peak each Rust build is two
# entries, so that is room for each entry to grow by about 0.2 GB (six of them)
# between changes to the manifests. Before this change the
# repository held 10.8 GB (2026-11-15): the Linux build twice (3.8 and 2.8 GB),
# the macOS one twice (2.9 and 2.2), and a copy of the browsers per pull
# request. A change that adds a cache, or makes one larger, keeps the peak
# under the limit and adds its row; `cache-prune` warns of an entry on main
# that no family claims.
#
# Which jobs build what, and who saves: on Linux only `Check (ubuntu-latest)`
# saves the Rust build: it builds the most, and `Release-build tests`, the
# host part of `UI journeys` and red-first.yml start from its build. (The
# first job to finish used to save it, `Wasm tests`, a few hundred
# megabytes, and every other Linux job restored that and rebuilt nearly every
# crate.) `UI journeys`, `Release-build tests` and both `Service managers`
# jobs empty their target dir after their last step on a push (on macOS too,
# leaving that OS's save to `Check (macos-latest)`), and mbx skips the save of
# a job with no build to keep. `Wasm tests` builds wasm32 tests, which Check
# doesn't, so it keeps a family of its own (the `generation` input of
# `rust-cache`). A cache per job doesn't fit the limit. If Check fails on a
# push, that commit saves no Linux build, and pull requests restore the one
# before.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened]
  schedule:
    - cron: "17 3 * * *" # nightly full mutation run
  workflow_dispatch:

permissions:
  contents: read

# On pull requests only a push (`synchronize`) may cancel a run; any other
# pull request run (opened, reopened) gets a group of its own, so a required
# check is never left cancelled on the commit being merged (see red-first.yml).
# The nightly run and manual runs get a group of their own too: GitHub keeps
# one pending run per group and cancels the older one when another queues, so
# sharing main's queue, nightly run 43208497343 (2026-11-12) was cancelled
# before any job started, when a push to main queued behind it; and a running
# nightly (the full mutation run takes up to 180 minutes) held main's push CI
# behind it. Only pushes to main share one group, and queue.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}-${{ ((github.event_name == 'pull_request' && github.event.action != 'synchronize') || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && github.run_id || 'serial' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  # CI builds are cached and thrown away, never debugged in place. The restored
  # target dir already makes a build incremental crate by crate; rustc's own
  # incremental mode would only add its session files to every cache entry.
  # The mbx action doesn't set it. Debug info is Cargo.toml's dev profile, the
  # same as a local build's.
  CARGO_INCREMENTAL: 0
  # Keeps Cargo 1.100's build dir in the layout mbx's cache can use. Since 1.100
  # (rust-toolchain.toml, #411) Cargo puts intermediate files under
  # target/<profile>/build/<package>/<hash>/ and no longer writes
  # target/<profile>/.fingerprint/ or deps/. The mbx action (v1.7.3) decides
  # whether a build is worth saving by looking for a non-empty `.fingerprint`
  # directory, and it prunes the saved tree by the old directory names, so on
  # the new layout every job logged "No reusable Cargo target state was
  # produced" and saved nothing (#598). Cargo 1.100 still honours this
  # variable, which it calls temporary, and means to delete the legacy layout
  # once a few weeks have passed (rust-lang/cargo#17182). When it does, the
  # "Build cache" step below warns on every push to main, and the fix is an
  # mbx action that knows the new layout. red-first.yml sets it too: it copies
  # a restored target dir.
  __CARGO_TEMPORARY_BUILD_DIR_NEW_LAYOUT_OPT_OUT: 1

jobs:
  # Tells a docs-only pull request from one that touches code, with plain git,
  # so the jobs below can skip the Rust work. Anything that isn't clearly docs
  # counts as code, and so does a failure here: the jobs below run unless this
  # job says "true". Pushes to main and the nightly run skip this job and run
  # everything.
  changes:
    name: Changed paths
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    outputs:
      docs-only: ${{ steps.diff.outputs.docs-only }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - id: diff
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          # A failing git command fails this step, and then every job below runs.
          git diff -z --name-only --no-renames "$BASE_SHA...$HEAD_SHA" > "$RUNNER_TEMP/changed-files"
          docs_only=true
          count=0
          while IFS= read -r -d '' file; do
            count=$((count + 1))
            case "$file" in
              # Markdown under crates/ can be include_str!'d or doc-tested.
              crates/*) docs_only=false ;;
              # The guides' config.toml and keyring examples are tested
              # (crates/adapters/config/tests/guide.rs).
              docs/guide/*) docs_only=false ;;
              docs/* | LICENSE* | .github/ISSUE_TEMPLATE/* | *.md) ;;
              *) docs_only=false ;;
            esac
          done < "$RUNNER_TEMP/changed-files"
          # A change with no files isn't a docs change.
          if [ "$count" -eq 0 ]; then docs_only=false; fi
          echo "docs-only=$docs_only" >> "$GITHUB_OUTPUT"

  check:
    name: Check (${{ matrix.name }})
    needs: changes
    # A docs-only pull request skips every step but not the job. A matrix job
    # that its own `if` skips never creates the per-leg checks the ruleset
    # requires ("Check (ubuntu-latest)", "Check (macos-latest)"), so they would
    # stay "Expected" and block the merge. ui and mutants have fixed names and
    # skip as whole jobs.
    if: ${{ !cancelled() && github.event_name != 'schedule' }}
    strategy:
      fail-fast: false
      # `name` is the leg's name in the check the ruleset requires, so it
      # stays `ubuntu-latest` and `macos-latest`; `os` is the runner image,
      # pinned, and a pull request of its own bumps it (development.md §13.8).
      matrix:
        include:
          - name: ubuntu-latest
            os: ubuntu-26.04
          - name: macos-latest
            os: macos-26
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      # Every pull request is checked out: a docs-only one still runs the
      # agent-guidance path check, the paragraph-length check and the
      # decision-index check below, which `just lint` runs for the rest.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - if: needs.changes.outputs.docs-only == 'true'
        run: scripts/check-doc-paths.sh
      # Installs the toolchain rust-toolchain.toml names, so mbx keys on it.
      - if: needs.changes.outputs.docs-only != 'true'
        run: rustup toolchain install
      # A build-cache outage must not fail a required check: with the step
      # allowed to fail, the build runs uncached (slower, still correct). The
      # same applies to the other mr-boxington steps below.
      - if: needs.changes.outputs.docs-only != 'true'
        uses: $/.github/actions/rust-cache
        continue-on-error: true
      # Only the host clippy and the tests can differ by OS (`cfg(target_os)`
      # code). Formatting, the wasm32 clippy, the journey, doc-path and
      # paragraph-length lints, the architecture checks and the contrast gate
      # give one answer anywhere, so they run on Linux alone; macOS needs no
      # Node then. A docs-only pull request sets Node up as well, for the
      # paragraph-length and decision-index checks. Every setup-node reads
      # Node's major version from ui-tests/.nvmrc, which a pull request of its
      # own bumps (development.md §13.8).
      - if: runner.os == 'Linux'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: ui-tests/.nvmrc
          package-manager-cache: false
      - if: needs.changes.outputs.docs-only == 'true' && runner.os == 'Linux'
        run: node scripts/check-paragraph-length.ts
      - if: needs.changes.outputs.docs-only == 'true' && runner.os == 'Linux'
        run: node scripts/decision-index.ts
      - if: needs.changes.outputs.docs-only != 'true'
        uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
        with:
          tool: just,cargo-nextest
      # leptosfmt at the version the Justfile pins, for `just fmt-check`.
      # install-action lists no leptosfmt (manifests/ at that SHA), so it
      # falls back to cargo-binstall at that version, which takes the
      # release's prebuilt binary, as for wasm-bindgen in red-first.yml.
      - id: leptosfmt
        if: needs.changes.outputs.docs-only != 'true' && runner.os == 'Linux'
        run: echo "version=$(just --evaluate leptosfmt_version)" >> "$GITHUB_OUTPUT"
      - if: needs.changes.outputs.docs-only != 'true' && runner.os == 'Linux'
        uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
        with:
          tool: leptosfmt@${{ steps.leptosfmt.outputs.version }}
      # The rustic CLI the profile golden tests compare against (§6.2): the
      # official release, checked against the SHA-256 the script pins.
      - if: needs.changes.outputs.docs-only != 'true'
        run: scripts/install-rustic.sh
      # The one job that saves npm's cache on a push to main (the header
      # comment's table).
      - if: needs.changes.outputs.docs-only != 'true' && runner.os == 'Linux'
        uses: $/.github/actions/npm-ci
      - if: needs.changes.outputs.docs-only != 'true' && runner.os == 'Linux'
        run: just fmt-check
      - if: needs.changes.outputs.docs-only != 'true' && runner.os == 'Linux'
        run: just lint
      - if: needs.changes.outputs.docs-only != 'true' && runner.os != 'Linux'
        run: just clippy
      - if: needs.changes.outputs.docs-only != 'true' && runner.os == 'Linux'
        run: just architecture
      - if: needs.changes.outputs.docs-only != 'true' && runner.os == 'Linux'
        run: just test-contrast
      # The ci profile (.config/nextest.toml) retries, reports flaky tests and
      # writes the JUnit report. The step has a limit of its own, below the
      # job's 45 minutes: a hang (#638) then fails the step, which keeps its
      # log, where cancelling the job at its limit discarded it. The figure is
      # measured in development.md §13.8.
      - if: needs.changes.outputs.docs-only != 'true'
        run: just test
        timeout-minutes: 30
        env:
          NEXTEST_PROFILE: ci
      # Nothing fails when the build cache saves nothing: every later run just
      # starts cold (#598 went unseen for that reason). mbx saves only a target
      # dir with a non-empty `target/<profile>/.fingerprint`, so a main push
      # that built none warns here, where the maintainers read the run.
      - name: Build cache
        if: github.event_name == 'push' && needs.changes.outputs.docs-only != 'true'
        run: |
          if [ -z "$(ls -A target/debug/.fingerprint 2>/dev/null)" ]; then
            echo "::warning title=Build cache::target/debug/.fingerprint is empty, so mbx will not save this build and pull requests start cold. See the __CARGO_TEMPORARY_BUILD_DIR_NEW_LAYOUT_OPT_OUT comment in ci.yml (#598)."
          fi
      # Kept 14 days, not the repository's default of 90: a report is read
      # while its failure is fresh, and two weeks still covers a run looked at
      # after a week away. The same holds for both `mutants.out` uploads below.
      - if: always() && needs.changes.outputs.docs-only != 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: junit-${{ matrix.name }}
          path: target/nextest/ci/junit.xml
          retention-days: 14

  # The same journeys in Firefox and WebKit run as `ui-engines` below; this
  # job stays Chromium alone, under the name the ruleset requires (a matrix
  # job that its own `if` skips never creates that check; see `check` above).
  ui:
    name: UI journeys (Chromium, axe-core, keyboard)
    needs: changes
    if: ${{ !cancelled() && github.event_name != 'schedule' && needs.changes.outputs.docs-only != 'true' }}
    runs-on: ubuntu-26.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Installs the toolchain rust-toolchain.toml names, so mbx keys on it.
      - run: rustup toolchain install
      - uses: $/.github/actions/rust-cache
        continue-on-error: true
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: ui-tests/.nvmrc
          package-manager-cache: false
      # trunk downloads wasm-bindgen and wasm-opt (binaryen) from GitHub
      # releases on a cold build; during a releases outage those 504 and fail
      # the job. Cache its tools so only the first build after a lockfile
      # change fetches them.
      - id: trunk
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/trunk
          key: trunk-tools-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: trunk-tools-${{ runner.os }}-
      - uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
        with:
          tool: just,trunk
      - uses: $/.github/actions/npm-ci
        with:
          save: "false"
      - uses: $/.github/actions/browser
        with:
          engines: chromium
      - run: just test-ui
      # The JUnit report and each failed scenario's trace and screenshot
      # (ui-tests/support/world.ts), only when the run failed, kept 14 days as
      # the JUnit and `mutants.out` uploads are. The attempt in the name keeps
      # a rerun's upload from colliding with the first's.
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ui-reports-chromium-attempt-${{ github.run_attempt }}
          path: ui-tests/reports/
          retention-days: 14
      # Saved here, not as the job starts, so that a build that failed leaves
      # nothing behind, and only from main: a pull request's entry would be
      # one no other pull request reads.
      - if: github.event_name == 'push' && steps.trunk.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/trunk
          key: trunk-tools-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
      # Leaves the build cache to `Check (ubuntu-latest)` (top of this file).
      - if: github.event_name == 'push'
        run: rm -rf target

  # The `ui` job's journeys in Gecko (Firefox, Zen, LibreWolf) and WebKit
  # (Safari's engine, the closest stand-in for Safari that runs on Linux).
  # Not required checks: the maintainer adds them to the ruleset once they have
  # a clean record. Its steps are the `ui` job's; change both together.
  ui-engines:
    name: UI journeys (${{ matrix.name }}, axe-core, keyboard)
    needs: changes
    if: ${{ !cancelled() && github.event_name != 'schedule' && needs.changes.outputs.docs-only != 'true' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Firefox
            engine: firefox
          - name: WebKit
            engine: webkit
    runs-on: ubuntu-26.04
    timeout-minutes: 45
    env:
      LADDERBACK_UI_BROWSER: ${{ matrix.engine }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install
      - uses: jdx/mr-boxington-action@88acf2bb50552c7c508cbac13e5f8c576b95b1de # v1.7.3
        continue-on-error: true
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: ui-tests/.nvmrc
          cache: npm
          cache-dependency-path: ui-tests/package-lock.json
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/trunk
          key: trunk-tools-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: trunk-tools-${{ runner.os }}-
      - uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
        with:
          tool: just,trunk
      - run: npm ci
        working-directory: ui-tests
      - uses: $/.github/actions/browser
        with:
          engines: ${{ matrix.engine }}
      # `LADDERBACK_UI_BROWSER` (above) picks the engine.
      - run: just test-ui
      # As in the `ui` job.
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ui-reports-${{ matrix.engine }}-attempt-${{ github.run_attempt }}
          path: ui-tests/reports/
          retention-days: 14
      # Also after a failed run: these jobs are expected to fail more often, and
      # a target left behind could be saved under the shared Linux build key.
      - if: ${{ !cancelled() && github.event_name == 'push' }}
        run: rm -rf target

  # The red-first check (red-first.yml) installs all three engines in one job,
  # under caches keyed on that set, and runs only on pull requests, whose
  # caches no other pull request can restore: GitHub shares only the base
  # branch's. So a push to main saves the set here, and each behaviour pull
  # request's red-first run restores it instead of downloading three browsers
  # and their system packages through Ubuntu's mirrors. Not a required check.
  browser-cache:
    name: Browser cache for the red-first check
    if: github.event_name == 'push'
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: ui-tests/.nvmrc
          package-manager-cache: false
      - uses: $/.github/actions/npm-ci
        with:
          save: "false"
      - uses: $/.github/actions/browser
        with:
          engines: chromium firefox webkit

  # The wasm-bindgen tests (`#[wasm_bindgen_test]`) under Node. Not a required
  # check: add it to the ruleset once it has proved stable. The wasm32 target
  # comes with the toolchain (rust-toolchain.toml). The test runner must be the
  # version of `wasm-bindgen` that Cargo.lock pins, so `just` reads it from the
  # lockfile and a second install step fetches that release's binaries. A
  # release that the pinned action doesn't list isn't an error: see the same
  # step in red-first.yml.
  wasm:
    name: Wasm tests (Node)
    needs: changes
    if: ${{ !cancelled() && github.event_name != 'schedule' && needs.changes.outputs.docs-only != 'true' }}
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Installs the toolchain rust-toolchain.toml names, so mbx keys on it.
      - run: rustup toolchain install
      # Its own cache key, not Check's (top of this file).
      - uses: $/.github/actions/rust-cache
        continue-on-error: true
        with:
          generation: v1-wasm
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: ui-tests/.nvmrc
          package-manager-cache: false
      - uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
        with:
          tool: just
      - id: wasm-bindgen
        run: echo "version=$(just _wasm-bindgen-version)" >> "$GITHUB_OUTPUT"
      - uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
        with:
          tool: wasm-bindgen@${{ steps.wasm-bindgen.outputs.version }}
      - run: just test-wasm

  # actionlint and zizmor on the workflows (`just lint-workflows`). zizmor's
  # online audits (known-vulnerable actions, impostor commits) read public
  # GitHub data with the run's read-only token. Not a required check: the
  # maintainer may add it to the ruleset once it has proved stable.
  workflow-lint:
    name: Workflow lint (actionlint, zizmor)
    needs: changes
    if: ${{ !cancelled() && github.event_name != 'schedule' && needs.changes.outputs.docs-only != 'true' }}
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
        with:
          tool: just,zizmor
      # Not in install-action's list: the official release, checked against
      # the SHA-256 the script pins.
      - run: scripts/install-actionlint.sh
      - run: just lint-workflows
        env:
          GH_TOKEN: ${{ github.token }}

  # `install-service` against the real service managers (#544): launchd on
  # macOS, a systemd user manager on Linux. The stand-ins the tests use take
  # the manager's commands at their word, so #542's race showed only on a real
  # Mac. scripts/service-contract.sh runs the adapter's contract against the
  # real manager, then the real binary: install, install again over the
  # running service, remove. Both fail, never skip, when no manager answers.
  # Not a required check: the maintainer may add it to the ruleset once it has
  # a clean record (development.md §13.8).
  service:
    name: Service managers (${{ matrix.name }})
    needs: changes
    if: ${{ !cancelled() && github.event_name != 'schedule' && needs.changes.outputs.docs-only != 'true' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: launchd
            os: macos-26
          - name: systemd
            os: ubuntu-26.04
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    env:
      LADDERBACK_TEST_REAL_SERVICE_MANAGER: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Installs the toolchain rust-toolchain.toml names, so mbx keys on it.
      - run: rustup toolchain install
      - uses: $/.github/actions/rust-cache
        continue-on-error: true
      - uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
        with:
          tool: cargo-nextest
      # The runner starts jobs outside any login session, so its user has no
      # systemd user manager. Lingering starts one (`user@<uid>.service`), as
      # at boot for a lingering user; the step waits until it answers, and
      # fails if it doesn't within 30 s. macOS needs nothing: the runner user
      # is logged in, with a GUI session launchd serves.
      - if: runner.os == 'Linux'
        run: |
          sudo loginctl enable-linger "$(id -un)"
          runtime="/run/user/$(id -u)"
          for _ in $(seq 1 30); do
            if XDG_RUNTIME_DIR="$runtime" systemctl --user show-environment > /dev/null 2>&1; then
              {
                echo "XDG_RUNTIME_DIR=$runtime"
                echo "DBUS_SESSION_BUS_ADDRESS=unix:path=$runtime/bus"
              } >> "$GITHUB_ENV"
              exit 0
            fi
            sleep 1
          done
          echo "no systemd user manager answers for $(id -un) after 30 s of lingering" >&2
          exit 1
      - run: scripts/service-contract.sh contract
      # Runs after a failed contract too, so one run shows both results. The
      # runner is thrown away after the job, so the step may install the real
      # service, which it does only when told so.
      - if: ${{ !cancelled() }}
        run: scripts/service-contract.sh install
        env:
          LADDERBACK_TEST_INSTALL_SERVICE: "1"
      # Leaves the build cache to the `Check` jobs (top of this file).
      - if: github.event_name == 'push'
        run: rm -rf target

  # The tests of the build a release is: `--no-default-features`, which leaves
  # out the development pseudolocales (technical design §8.4). `just test`
  # builds with the defaults, so the tests that exist only without them run
  # here alone. A job of its own, so that the `Check` jobs stay as they are and
  # this one builds beside them. A required check (ruleset "Protect main"):
  # don't rename it.
  release-tests:
    name: Release-build tests (no default features)
    needs: changes
    if: ${{ !cancelled() && github.event_name != 'schedule' && needs.changes.outputs.docs-only != 'true' }}
    runs-on: ubuntu-26.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Installs the toolchain rust-toolchain.toml names, so mbx keys on it.
      - run: rustup toolchain install
      - uses: $/.github/actions/rust-cache
        continue-on-error: true
      - uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
        with:
          tool: just,cargo-nextest
      # The rustic CLI an e2e scenario compares against (§6.2), as in `check`:
      # without it that scenario skips, and the skip list would differ.
      - run: scripts/install-rustic.sh
      # The ci profile (.config/nextest.toml) retries and reports flaky tests.
      - run: just test-release
        env:
          NEXTEST_PROFILE: ci
      # Leaves the build cache to `Check (ubuntu-latest)` (top of this file).
      - if: github.event_name == 'push'
        run: rm -rf target

  # The dependency tree against deny.toml: RustSec advisories, licenses, banned
  # crates and sources (technical design §13.6). It also runs on the nightly
  # schedule, because an advisory can appear with no change to the code; a
  # scheduled run notifies no one, so a failed one opens an issue (`deny-report`
  # below), as `mutants-nightly` does. Not a required check: the maintainer may
  # add it to the ruleset once it has proved stable. It fetches the advisory
  # database, so a GitHub outage can fail it for a reason that isn't a
  # dependency's.
  deny:
    name: Dependencies (cargo-deny)
    needs: changes
    # `changes` is skipped on a push, the nightly run and a manual run; with
    # `!cancelled()` this job runs then, and only a docs-only pull request skips it.
    if: ${{ !cancelled() && needs.changes.outputs.docs-only != 'true' }}
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # cargo-deny reads the tree through `cargo metadata`, which needs the
      # toolchain rust-toolchain.toml names. Nothing is compiled, so no build cache.
      - run: rustup toolchain install
      - uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
        with:
          tool: just,cargo-deny
      - run: just deny

  # A failed nightly `deny` opens an issue, or comments on the open one. A job
  # of its own, as release-builds.yml's `report` is, so only it holds
  # `issues: write`, and `deny`, which runs a pull request's code (its
  # Cargo.lock and deny.toml), doesn't. Its name matches no required check.
  deny-report:
    name: Report a failed nightly dependency check
    needs: deny
    # Only on the nightly run, and only when `deny` failed, not when it was
    # cancelled. The title is fixed, so a second failure finds the open issue.
    if: failure() && github.event_name == 'schedule'
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    # One report at a time, so two failed runs don't both open an issue.
    concurrency:
      group: ci-deny-report
      cancel-in-progress: false
    permissions:
      issues: write # to open or comment on the issue; no checkout, so no contents
    steps:
      # `$/`: the action from the commit this workflow runs, with no checkout.
      - uses: $/.github/actions/report-nightly-failure
        with:
          title: Nightly dependency check failed
          body: "The nightly dependency check (`just deny`) failed: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}. A new RustSec advisory is the usual cause; the job's log names it."

  # The pull request's mutants, split over four runners. One runner, even two
  # mutants at a time, outran the 60-minute limit on a large change (#443:
  # 371 mutants), so each shard takes every fourth mutant (round-robin, which
  # spreads the slow `app` mutants evenly) within that limit.
  mutants-shard:
    name: Mutation testing (shard ${{ matrix.shard }} of 4)
    needs: changes
    if: ${{ !cancelled() && github.event_name == 'pull_request' && needs.changes.outputs.docs-only != 'true' }}
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      # Installs the toolchain rust-toolchain.toml names, so mbx keys on it.
      - run: rustup toolchain install
      - uses: $/.github/actions/rust-cache
        continue-on-error: true
      - uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
        with:
          tool: just,cargo-mutants
      # Two mutants at a time: each builds in its own copy of the tree, and the
      # runner has four cores. `--caught --unviable` print every outcome as it
      # comes, so a shard that runs out of time shows how far it got.
      - run: just mutants "origin/$BASE_REF" --jobs 2 --shard "$SHARD/4" --sharding round-robin --caught --unviable
        env:
          BASE_REF: ${{ github.base_ref }}
          SHARD: ${{ matrix.shard }}
      # On a timeout too, which GitHub reports as a cancel, not a failure.
      - if: failure() || cancelled()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mutants.out-shard-${{ matrix.shard }}
          path: mutants.out
          retention-days: 14

  # The check the ruleset requires, by this name: it passes only when every
  # shard passed. `always()`, not `!cancelled()`: it must run, and so fail,
  # whenever a shard failed, timed out (a timeout ends a job as cancelled) or
  # was cancelled, since GitHub counts a skipped required check as passing.
  # A superseded run's summary then fails on a stale commit, which is
  # harmless. A docs-only pull request skips it with the shards, as before;
  # keep the rest of this `if` the same as the shards'.
  mutants:
    name: Mutation testing (changed code)
    needs: [changes, mutants-shard]
    if: ${{ always() && github.event_name == 'pull_request' && needs.changes.outputs.docs-only != 'true' }}
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - run: test "$SHARDS" = success || { echo "a mutation shard ended $SHARDS"; exit 1; }
        env:
          SHARDS: ${{ needs.mutants-shard.result }}

  # A scheduled run notifies no one, so a failure opens an issue, or comments
  # on the one already open, rather than going unseen.
  mutants-nightly:
    name: Mutation testing (full)
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-26.04
    timeout-minutes: 180
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Installs the toolchain rust-toolchain.toml names, so mbx keys on it.
      - run: rustup toolchain install
      - uses: $/.github/actions/rust-cache
        continue-on-error: true
      - uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
        with:
          tool: just,cargo-mutants
      - run: just mutants-all
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mutants.out
          path: mutants.out
          retention-days: 14
      # Only on a failure of this job's own steps (a timeout counts), not on
      # a cancel. The title is fixed, so a second failure finds the open issue.
      - if: failure()
        uses: $/.github/actions/report-nightly-failure
        with:
          title: Nightly mutation run failed
          body: "The full mutation run (`just mutants-all`) failed: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}. The run's `mutants.out` artifact lists the missed mutants and timeouts."

  # Deletes the Actions cache entries a push to main superseded, once the jobs
  # that save them are done: mbx saves in its post step, after a job's last
  # step, so no step of that job could run after its own save. The script keeps
  # the newest entry of each family below and deletes the others, so a family
  # never drops below one entry, and a run whose save failed deletes nothing
  # that pull requests restore (header comment: the design, and the footprint
  # this keeps the repository to). Runs after a failed job too: a family that
  # grew past one entry is pruned whatever happened to this run. The only job
  # that holds `actions: write`; the code it runs is main's own, checked out
  # without credentials. It is not a required check. A family is the regular
  # expression over the cache keys; each cache a job saves needs one here,
  # and the script warns of an entry on main that none claims. Where one
  # family's key begins another's (`chromium-` and `chromium-firefox-webkit-`),
  # the expression ends with what tells them apart.
  cache-prune:
    name: Prune superseded caches
    needs: [check, ui, wasm, browser-cache]
    if: ${{ !cancelled() && github.event_name == 'push' }}
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      actions: write # to delete cache entries
      contents: read # to check out the script
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: scripts/prune-cache.sh
          sparse-checkout-cone-mode: false
      # An entry saved before the manifest hash joined the key
      # (`...-v1-target-rust-...`) is in its family too, until the first
      # entry of the new layout supersedes it. The browsers' and package sets'
      # keys before the engine sets (`playwright-Linux-`, `playwright-debs-ubuntu`)
      # are the chromium set's. The package sets keep two entries: GitHub rolls
      # a runner image out beside the one before it, each run restores the set
      # of its own image, and the older of two is the one a run on the other
      # image is about to need.
      # Only for main's newest commit: a re-run of an older push run saves a
      # build of its own after the newer one, and its prune would delete the
      # newer entry. The next push prunes what this one leaves.
      - run: |
          tip=$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)
          if [ "$tip" != "$GITHUB_SHA" ]; then
            echo "::notice title=Cache prune::$GITHUB_SHA is not the tip of main ($tip), so nothing is pruned; a later push prunes."
            exit 0
          fi
          scripts/prune-cache.sh \
            '^linux-x64-mbx-v1-(m[0-9a-f]+-)?target-rust-' \
            '^linux-x64-mbx-v1-wasm-(m[0-9a-f]+-)?target-rust-' \
            '^darwin-arm64-mbx-v1-(m[0-9a-f]+-)?target-rust-' \
            '^trunk-tools-Linux-' \
            '^node-cache-Linux-x64-npm-' \
            '^playwright-(chromium-)?Linux-' \
            '^playwright-chromium-firefox-webkit-Linux-' \
            --keep 2 \
            '^playwright-debs-(chromium-)?ubuntu[0-9]+-' \
            '^playwright-debs-chromium-firefox-webkit-ubuntu[0-9]+-'
        env:
          GH_TOKEN: ${{ github.token }}
