# Every job runs the same `just` recipes developers and agents run locally.
# The red-first check is in red-first.yml.
#
# mr boxington (mbx) caches Cargo builds: pushes to main save the cache, pull
# requests only restore it. It keeps one build per OS and commit, under one
# key, and the first job to finish saves it; before, that was `Wasm tests`, a
# few hundred megabytes, and every other Linux job restored it and rebuilt
# nearly every crate. So on Linux only `Check (ubuntu-latest)` saves under that
# key: it builds the most, and `Release-build tests`, the host part of `UI
# journeys` and red-first.yml start from its build. `UI journeys` and
# `Release-build tests` empty their target dir after their last step on a
# push, and mbx skips the save of a job with no build to keep. `Wasm tests`
# builds wasm32 tests, which Check doesn't, so it keeps a cache of its own
# (`cache-generation`), a few hundred megabytes. A cache per job doesn't fit:
# the repository's Actions cache holds 10 GB, and the macOS build alone takes
# 4.7. If Check fails on a push, that commit saves no Linux build, and pull
# requests restore the one before.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened]
  schedule:
    - cron: "17 3 * * *" # nightly full mutation run
  workflow_dispatch:

permissions:
  contents: read

# On pull requests only a push (`synchronize`) may cancel a run; any other
# pull request run (opened, reopened) gets a group of its own, so a required
# check is never left cancelled on the commit being merged (see red-first.yml).
# The nightly run and manual runs get a group of their own too: GitHub keeps
# one pending run per group and cancels the older one when another queues, so
# sharing main's queue, nightly run 43208497343 (2026-11-12) was cancelled
# before any job started, when a push to main queued behind it; and a running
# nightly (the full mutation run takes up to 180 minutes) held main's push CI
# behind it. Only pushes to main share one group, and queue.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}-${{ ((github.event_name == 'pull_request' && github.event.action != 'synchronize') || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && github.run_id || 'serial' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  # CI builds are cached and thrown away, never debugged in place. The restored
  # target dir already makes a build incremental crate by crate; rustc's own
  # incremental mode would only add its session files to every cache entry.
  # The mbx action doesn't set it. Debug info is Cargo.toml's dev profile, the
  # same as a local build's.
  CARGO_INCREMENTAL: 0

jobs:
  # Tells a docs-only pull request from one that touches code, with plain git,
  # so the jobs below can skip the Rust work. Anything that isn't clearly docs
  # counts as code, and so does a failure here: the jobs below run unless this
  # job says "true". Pushes to main and the nightly run skip this job and run
  # everything.
  changes:
    name: Changed paths
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      docs-only: ${{ steps.diff.outputs.docs-only }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - id: diff
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          # A failing git command fails this step, and then every job below runs.
          git diff -z --name-only --no-renames "$BASE_SHA...$HEAD_SHA" > "$RUNNER_TEMP/changed-files"
          docs_only=true
          count=0
          while IFS= read -r -d '' file; do
            count=$((count + 1))
            case "$file" in
              # Markdown under crates/ can be include_str!'d or doc-tested.
              crates/*) docs_only=false ;;
              docs/* | LICENSE* | .github/ISSUE_TEMPLATE/* | *.md) ;;
              *) docs_only=false ;;
            esac
          done < "$RUNNER_TEMP/changed-files"
          # A change with no files isn't a docs change.
          if [ "$count" -eq 0 ]; then docs_only=false; fi
          echo "docs-only=$docs_only" >> "$GITHUB_OUTPUT"

  check:
    name: Check (${{ matrix.os }})
    needs: changes
    # A docs-only pull request skips every step but not the job. A matrix job
    # that its own `if` skips never creates the per-leg checks the ruleset
    # requires ("Check (ubuntu-latest)", "Check (macos-latest)"), so they would
    # stay "Expected" and block the merge. ui and mutants have fixed names and
    # skip as whole jobs.
    if: ${{ !cancelled() && github.event_name != 'schedule' }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      # Every pull request is checked out: a docs-only one still runs the
      # agent-guidance path check below, which `just lint` runs for the rest.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - if: needs.changes.outputs.docs-only == 'true'
        run: scripts/check-doc-paths.sh
      # Installs the toolchain rust-toolchain.toml names, so mbx keys on it.
      - if: needs.changes.outputs.docs-only != 'true'
        run: rustup toolchain install
      # A build-cache outage must not fail a required check: with the step
      # allowed to fail, the build runs uncached (slower, still correct). The
      # same applies to the other mr-boxington steps below.
      - if: needs.changes.outputs.docs-only != 'true'
        uses: jdx/mr-boxington-action@88acf2bb50552c7c508cbac13e5f8c576b95b1de # v1.7.3
        continue-on-error: true
      # Only the host clippy and the tests can differ by OS (`cfg(target_os)`
      # code). Formatting, the wasm32 clippy, the journey and doc-path lints,
      # the architecture checks and the contrast gate give one answer
      # anywhere, so they run on Linux alone; macOS needs no Node then.
      - if: needs.changes.outputs.docs-only != 'true' && runner.os == 'Linux'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: ui-tests/package-lock.json
      - if: needs.changes.outputs.docs-only != 'true'
        uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
        with:
          tool: just,cargo-nextest
      # The rustic CLI the profile golden tests compare against (§6.2): the
      # official release, checked against the SHA-256 the script pins.
      - if: needs.changes.outputs.docs-only != 'true'
        run: scripts/install-rustic.sh
      - if: needs.changes.outputs.docs-only != 'true' && runner.os == 'Linux'
        run: npm ci
        working-directory: ui-tests
      - if: needs.changes.outputs.docs-only != 'true' && runner.os == 'Linux'
        run: just fmt-check
      - if: needs.changes.outputs.docs-only != 'true' && runner.os == 'Linux'
        run: just lint
      - if: needs.changes.outputs.docs-only != 'true' && runner.os != 'Linux'
        run: just clippy
      - if: needs.changes.outputs.docs-only != 'true' && runner.os == 'Linux'
        run: just architecture
      - if: needs.changes.outputs.docs-only != 'true' && runner.os == 'Linux'
        run: just test-contrast
      # The ci profile (.config/nextest.toml) retries, reports flaky tests and
      # writes the JUnit report.
      - if: needs.changes.outputs.docs-only != 'true'
        run: just test
        env:
          NEXTEST_PROFILE: ci
      - if: always() && needs.changes.outputs.docs-only != 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: junit-${{ matrix.os }}
          path: target/nextest/ci/junit.xml

  ui:
    name: UI journeys (Chromium, axe-core, keyboard)
    needs: changes
    if: ${{ !cancelled() && github.event_name != 'schedule' && needs.changes.outputs.docs-only != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Installs the toolchain rust-toolchain.toml names, so mbx keys on it.
      - uses: jdx/mr-boxington-action@88acf2bb50552c7c508cbac13e5f8c576b95b1de # v1.7.3
        continue-on-error: true
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: ui-tests/package-lock.json
      # trunk downloads wasm-bindgen and wasm-opt (binaryen) from GitHub
      # releases on a cold build; during a releases outage those 504 and fail
      # the job. Cache its tools so only the first build after a lockfile
      # change fetches them.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/trunk
          key: trunk-tools-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: trunk-tools-${{ runner.os }}-
      - uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
        with:
          tool: just,trunk
      - run: npm ci
        working-directory: ui-tests
      - uses: $/.github/actions/chromium
      - run: just test-ui
      # Leaves the build cache to `Check (ubuntu-latest)` (top of this file).
      - if: github.event_name == 'push'
        run: rm -rf target

  # The wasm-bindgen tests (`#[wasm_bindgen_test]`) under Node. Not a required
  # check: add it to the ruleset once it has proved stable. The wasm32 target
  # comes with the toolchain (rust-toolchain.toml). The test runner must be the
  # version of `wasm-bindgen` that Cargo.lock pins, so `just` reads it from the
  # lockfile and a second install step fetches that release's binaries. A
  # release that the pinned action doesn't list isn't an error: see the same
  # step in red-first.yml.
  wasm:
    name: Wasm tests (Node)
    needs: changes
    if: ${{ !cancelled() && github.event_name != 'schedule' && needs.changes.outputs.docs-only != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Installs the toolchain rust-toolchain.toml names, so mbx keys on it. Its
      # own cache key, not Check's (top of this file).
      - uses: jdx/mr-boxington-action@88acf2bb50552c7c508cbac13e5f8c576b95b1de # v1.7.3
        continue-on-error: true
        with:
          cache-generation: v1-wasm
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: lts/*
      - uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
        with:
          tool: just
      - id: wasm-bindgen
        run: echo "version=$(just _wasm-bindgen-version)" >> "$GITHUB_OUTPUT"
      - uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
        with:
          tool: wasm-bindgen@${{ steps.wasm-bindgen.outputs.version }}
      - run: just test-wasm

  # actionlint and zizmor on the workflows (`just lint-workflows`). zizmor's
  # online audits (known-vulnerable actions, impostor commits) read public
  # GitHub data with the run's read-only token. Not a required check: the
  # maintainer may add it to the ruleset once it has proved stable.
  workflow-lint:
    name: Workflow lint (actionlint, zizmor)
    needs: changes
    if: ${{ !cancelled() && github.event_name != 'schedule' && needs.changes.outputs.docs-only != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
        with:
          tool: just,zizmor
      # Not in install-action's list: the official release, checked against
      # the SHA-256 the script pins.
      - run: scripts/install-actionlint.sh
      - run: just lint-workflows
        env:
          GH_TOKEN: ${{ github.token }}

  # The tests of the build a release is: `--no-default-features`, which leaves
  # out the development pseudolocales (technical design §8.4). `just test`
  # builds with the defaults, so the tests that exist only without them run
  # here alone. A job of its own, so that the `Check` jobs stay as they are and
  # this one builds beside them. A required check (ruleset "Protect main"):
  # don't rename it.
  release-tests:
    name: Release-build tests (no default features)
    needs: changes
    if: ${{ !cancelled() && github.event_name != 'schedule' && needs.changes.outputs.docs-only != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Installs the toolchain rust-toolchain.toml names, so mbx keys on it.
      - uses: jdx/mr-boxington-action@88acf2bb50552c7c508cbac13e5f8c576b95b1de # v1.7.3
        continue-on-error: true
      - uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
        with:
          tool: just,cargo-nextest
      # The rustic CLI an e2e scenario compares against (§6.2), as in `check`:
      # without it that scenario skips, and the skip list would differ.
      - run: scripts/install-rustic.sh
      # The ci profile (.config/nextest.toml) retries and reports flaky tests.
      - run: just test-release
        env:
          NEXTEST_PROFILE: ci
      # Leaves the build cache to `Check (ubuntu-latest)` (top of this file).
      - if: github.event_name == 'push'
        run: rm -rf target

  # The dependency tree against deny.toml: RustSec advisories, licences, banned
  # crates and sources (technical design §13.6). It also runs on the nightly
  # schedule, because an advisory can appear with no change to the code; a
  # scheduled run notifies no one, so a failed one opens an issue, as
  # `mutants-nightly` does. Not a required check: the maintainer may add it to
  # the ruleset once it has proved stable. It fetches the advisory database,
  # so a GitHub outage can fail it for a reason that isn't a dependency's.
  deny:
    name: Dependencies (cargo-deny)
    needs: changes
    # `changes` is skipped on a push, the nightly run and a manual run; with
    # `!cancelled()` this job runs then, and only a docs-only pull request skips it.
    if: ${{ !cancelled() && needs.changes.outputs.docs-only != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # `issues: write` is for the nightly report below; a pull request from a
    # fork gets a read-only token whatever this says.
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # cargo-deny reads the tree through `cargo metadata`, which needs the
      # toolchain rust-toolchain.toml names. Nothing is compiled, so no build cache.
      - run: rustup toolchain install
      - uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
        with:
          tool: just,cargo-deny
      - run: just deny
      # Only on the nightly run, and only on a failure of this job's own
      # steps. The title is fixed, so a second failure finds the open issue.
      - if: failure() && github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          title="Nightly dependency check failed"
          body="The nightly dependency check (\`just deny\`) failed: $RUN_URL. A new RustSec advisory is the usual cause; the job's log names it."
          number=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "\"$title\" in:title" \
            --json number,title --jq "map(select(.title == \"$title\")) | .[0].number // empty")
          if [ -n "$number" ]; then
            gh issue comment "$number" --repo "$GITHUB_REPOSITORY" --body "$body"
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$title" --label bug --body "$body"
          fi

  mutants:
    name: Mutation testing (changed code)
    needs: changes
    if: ${{ !cancelled() && github.event_name == 'pull_request' && needs.changes.outputs.docs-only != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      # Installs the toolchain rust-toolchain.toml names, so mbx keys on it.
      - uses: jdx/mr-boxington-action@88acf2bb50552c7c508cbac13e5f8c576b95b1de # v1.7.3
        continue-on-error: true
      - uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
        with:
          tool: just,cargo-mutants
      - run: just mutants "origin/$BASE_REF"
        env:
          BASE_REF: ${{ github.base_ref }}
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mutants.out
          path: mutants.out

  # A scheduled run notifies no one, so a failure opens an issue, or comments
  # on the one already open, rather than going unseen.
  mutants-nightly:
    name: Mutation testing (full)
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Installs the toolchain rust-toolchain.toml names, so mbx keys on it.
      - uses: jdx/mr-boxington-action@88acf2bb50552c7c508cbac13e5f8c576b95b1de # v1.7.3
        continue-on-error: true
      - uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
        with:
          tool: just,cargo-mutants
      - run: just mutants-all
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mutants.out
          path: mutants.out
      # Only on a failure of this job's own steps (a timeout counts), not on
      # a cancel. The title is fixed, so a second failure finds the open issue.
      - if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          title="Nightly mutation run failed"
          body="The full mutation run (\`just mutants-all\`) failed: $RUN_URL. The run's \`mutants.out\` artifact lists the missed mutants and timeouts."
          number=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "\"$title\" in:title" \
            --json number,title --jq "map(select(.title == \"$title\")) | .[0].number // empty")
          if [ -n "$number" ]; then
            gh issue comment "$number" --repo "$GITHUB_REPOSITORY" --body "$body"
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$title" --label bug --body "$body"
          fi
