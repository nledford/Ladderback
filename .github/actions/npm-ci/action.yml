# `npm ci` in ui-tests with npm's download cache (~/.npm), for ci.yml's jobs.
# Use it after setup-node, as `uses: $/.github/actions/npm-ci` (the action from
# the commit the workflow runs, whatever the job checked out).
#
# setup-node's own `cache: npm` saves the cache from every run, pull requests
# included, and a pull request's entry is one no other pull request can read.
# This restores on every run and saves only from a push to main, which is the
# one entry every pull request reads (ci.yml's header comment has the whole
# design). The key is setup-node's, but GitHub's version of an entry hashes the
# path too, so the entry setup-node saved misses once; the first push to main
# saves this action's, and cache-prune deletes the old one.
#
# A job that shares main's push with another job that saves this cache sets
# `save: "false"`, so the two don't race for the same key.
name: npm ci for the UI tests
description: Installs ui-tests' npm packages from a download cache that only a push to main saves.
inputs:
  save:
    description: 'Whether a push to main saves the cache after a miss: "true" or "false".'
    default: "true"
runs:
  using: composite
  steps:
    - id: key
      shell: bash
      env:
        LOCK_HASH: ${{ hashFiles('ui-tests/package-lock.json') }}
      run: |
        arch=$(echo "$RUNNER_ARCH" | tr '[:upper:]' '[:lower:]')
        echo "key=node-cache-$RUNNER_OS-$arch-npm-$LOCK_HASH" >> "$GITHUB_OUTPUT"
    - id: restore
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/.npm
        key: ${{ steps.key.outputs.key }}
    - shell: bash
      working-directory: ui-tests
      run: npm ci
    - if: inputs.save == 'true' && steps.restore.outputs.cache-hit != 'true' && github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/.npm
        key: ${{ steps.key.outputs.key }}
