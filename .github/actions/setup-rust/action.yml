# The Rust setup of every job that runs Rust: the toolchain, the build cache
# and the tools the job names, in that order. Use it, after the checkout, as
# `uses: $/.github/actions/setup-rust` (the action from the commit the workflow
# runs, whatever the job checked out), so that a change to the setup is made
# here once and no job drifts from the others (#996). ci.yml's header comment
# is the design of the cache as a whole; this file is its key.
#
# The toolchain. `rustup toolchain install` installs the version
# rust-toolchain.toml names (development.md §13.12), before the cache, so mbx
# keys on it and a cache outage can't leave a job without it.
#
# The cache. A build-cache outage must not fail a required check, so each of
# its steps may fail: the build then runs uncached (slower, still correct).
# `cache: "false"` leaves it out, for a job that compiles nothing.
#
# The mode (#1076). mbx's `github-cache-mode` is `target` here, its default,
# written out below: the entry is the warm Cargo target tree. mbx's other mode,
# `objects` (compiler outputs under a hash of their own inputs), was tried in
# #1078 and went back: on main's push runs of `Check (ubuntu-latest)` the
# `just lint` step took 3.8 to 5.2 minutes against 1.2, and the job's median
# went from 9.8 to 12.4 minutes before any other change to lint. ci.yml's
# header comment has the numbers.
#
# Why the key has a manifest hash. Cargo names an artifact by a hash of
# everything that goes into it, the manifests, the lockfile and the toolchain
# among them, and never deletes an artifact it no longer uses. mbx saves the
# target dir each main commit leaves, and the next commit restores that one, so
# a change to any manifest left the old copies of every artifact it touched in
# the entry for good: adding one dependency to `domain` rehashed `domain` and
# everything built on it, tests included, and the Linux entry grew from 2.8 to
# 3.8 GB in one save (#727). The generation below holds the hash of those
# files, so a main commit that changes one starts from no build at all, and
# a build that only a source change touched still starts from the last one:
# between two such changes an entry doesn't grow.
#
# What restores what:
# - a push to main restores only an entry of its own manifest hash, or none,
#   and then saves its build as a new entry of that hash;
# - everything else (pull requests, the nightly run) restores an entry of its
#   own hash when there is one, and else the newest entry of any hash of its
#   own generation, a build that is stale in places and still saves most of
#   the compile. They never save: mbx saves on a push to the default branch
#   alone. The restore prefixes end in `-m`, the start of the hash, so the
#   default generation never restores the wasm one (`v1-wasm-m…`).
#
# The restore prefixes need the key's layout, which mbx documents as
# `<platform>-<architecture>-mbx-<generation>-<mode>-<toolchain>-<commit>`; the
# cache's last step warns when mbx's primary key doesn't start as this action
# expects, so a change of layout shows on the run and not as a cold build on
# every pull request. ci.yml's `cache-prune` job prunes by the same layout.
#
# The tools. `tools` is taiki-e/install-action's `tool` list (`just,trunk`);
# a tool pinned from a value only `just` can read (leptosfmt, wasm-bindgen)
# is the job's own step after this one.
name: Rust setup
description: Installs the pinned toolchain, restores (and on a push to main saves) the Cargo build, and installs the tools a job names.
inputs:
  tools:
    description: "The tools to install, as install-action's comma-separated `tool` list; empty installs none."
    default: ""
  cache:
    description: 'Whether to use the build cache: "true" or "false" (a job that compiles nothing).'
    default: "true"
  generation:
    description: "Names the cache of this job apart from the other jobs' (mbx's `cache-generation`). The manifest hash is added to it."
    default: v1
runs:
  using: composite
  steps:
    - shell: bash
      run: rustup toolchain install
    - id: keys
      if: inputs.cache == 'true'
      continue-on-error: true
      shell: bash
      env:
        GENERATION: ${{ inputs.generation }}
        MANIFESTS: ${{ hashFiles('Cargo.lock', 'rust-toolchain.toml', 'Cargo.toml', 'crates/**/Cargo.toml') }}
        # Only a push to main saves, so only it must not start from another
        # manifest hash's build.
        SAVES: ${{ github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
      run: |
        case "$RUNNER_OS" in
          Linux) platform=linux ;;
          macOS) platform=darwin ;;
          *) platform=$(echo "$RUNNER_OS" | tr '[:upper:]' '[:lower:]') ;;
        esac
        arch=$(echo "$RUNNER_ARCH" | tr '[:upper:]' '[:lower:]')
        generation="$GENERATION-m${MANIFESTS:0:12}"
        own="$platform-$arch-mbx-$generation-"
        {
          echo "generation=$generation"
          echo "own=$own"
          echo "restore-keys<<EOF"
          echo "$own"
          if [ "$SAVES" != true ]; then
            echo "$platform-$arch-mbx-$GENERATION-m"
          fi
          echo "EOF"
        } >> "$GITHUB_OUTPUT"
    - id: mbx
      if: steps.keys.outcome == 'success'
      continue-on-error: true
      uses: jdx/mr-boxington-action@88acf2bb50552c7c508cbac13e5f8c576b95b1de # v1.7.3
      with:
        github-cache-mode: target
        cache-generation: ${{ steps.keys.outputs.generation }}
        restore-keys: ${{ steps.keys.outputs.restore-keys }}
    - if: steps.mbx.outcome == 'success'
      continue-on-error: true
      shell: bash
      env:
        OWN: ${{ steps.keys.outputs.own }}
        PRIMARY: ${{ steps.mbx.outputs.cache-primary-key }}
      run: |
        case "$PRIMARY" in
          "$OWN"*) ;;
          *) echo "::warning title=Rust build cache::mbx's cache key '$PRIMARY' doesn't start with '$OWN', so mbx's key layout has changed: the restore keys in .github/actions/setup-rust/action.yml and ci.yml's cache-prune families no longer match it." ;;
        esac
    - if: inputs.tools != ''
      uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
      with:
        tool: ${{ inputs.tools }}
