# Production code never crashes (technical design §13.5): every crate root
# denies clippy::unwrap_used, expect_used, panic and friends. Tests may unwrap,
# expect and panic (todo!, unimplemented! and unreachable! stay denied there
# too).
#
# This file covers every crate without a clippy.toml of its own. `domain` and
# `app` have one (they also ban impure calls), and clippy reads the nearest
# file only, so these three lines are repeated there; the architecture check
# makes sure they agree.
allow-unwrap-in-tests = true
allow-expect-in-tests = true
allow-panic-in-tests = true

# On macOS, a signal that interrupts `TcpStream::connect` can make it return a
# stream that is not connected yet (testkit/src/net.rs, #170). `domain` and
# `app` don't need this line: their clippy.toml bans the whole type.
disallowed-methods = [
    { path = "std::net::TcpStream::connect", reason = "on macOS a signal makes it return a stream not yet connected: use testkit::net::connect in a test, TcpStream::connect_timeout elsewhere" },
]
