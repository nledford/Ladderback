# Production code never crashes (technical design §13.5): every crate root
# denies clippy::unwrap_used, expect_used, panic and friends. Tests may unwrap,
# expect and panic (todo!, unimplemented! and unreachable! stay denied there
# too).
#
# This file covers every crate without a clippy.toml of its own. `domain` and
# `app` have one (they also ban impure calls), and clippy reads the nearest
# file only, so these three lines are repeated there; the architecture check
# makes sure they agree.
allow-unwrap-in-tests = true
allow-expect-in-tests = true
allow-panic-in-tests = true

# The lints Cargo.toml adds beyond `all` (technical design §13.5): no block
# nested deeper than six, and tests may index (production code uses `get()`;
# string slices are checked in tests too). `cognitive-complexity-threshold`
# stays at clippy's default, 25.
# Repeated in `domain`'s and `app`'s clippy.toml; the architecture check makes
# sure they agree.
excessive-nesting-threshold = 6
allow-indexing-slicing-in-tests = true

# On macOS, a signal that interrupts `TcpStream::connect` can make it return a
# stream that is not connected yet (testkit/src/net.rs, #170). `domain` and
# `app` don't need this line: their clippy.toml bans the whole type.
#
# rustls's `builder()` takes the process's default provider, which the lock
# file's two providers leave unchosen, and the provider's own key exchange
# groups: every TLS config names aws-lc-rs and its groups (§16, decision 120,
# "Post-quantum key exchange for agent–hub connections"). The verifiers'
# `builder()` read that default too, and nothing installs or reads it.
disallowed-methods = [
    { path = "std::net::TcpStream::connect", reason = "on macOS a signal makes it return a stream not yet connected: use testkit::net::connect in a test, TcpStream::connect_timeout elsewhere" },
    { path = "rustls::ClientConfig::builder", reason = "it takes the process's default provider and groups: use builder_with_provider on aws-lc-rs with kx_groups set (decision 120)" },
    { path = "rustls::ServerConfig::builder", reason = "it takes the process's default provider and groups: use builder_with_provider on aws-lc-rs with kx_groups set (decision 120)" },
    { path = "rustls::ClientConfig::builder_with_protocol_versions", reason = "it takes the process's default provider and groups: use builder_with_provider on aws-lc-rs with kx_groups set (decision 120)" },
    { path = "rustls::ServerConfig::builder_with_protocol_versions", reason = "it takes the process's default provider and groups: use builder_with_provider on aws-lc-rs with kx_groups set (decision 120)" },
    { path = "rustls::client::WebPkiServerVerifier::builder", reason = "it takes the process's default provider: use builder_with_provider on aws-lc-rs (decision 120)" },
    { path = "rustls::server::WebPkiClientVerifier::builder", reason = "it takes the process's default provider: use builder_with_provider on aws-lc-rs (decision 120)" },
    { path = "rustls::crypto::CryptoProvider::get_default", reason = "no process default provider is read: name aws-lc-rs and its groups (decision 120)" },
    { path = "rustls::crypto::CryptoProvider::install_default", reason = "no process default provider is installed: name aws-lc-rs and its groups (decision 120)" },
]
