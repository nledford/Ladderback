# Production code never crashes (technical design §13.5): every crate root
# denies clippy::unwrap_used, expect_used, panic and friends. Tests may unwrap,
# expect and panic (todo!, unimplemented! and unreachable! stay denied there
# too).
#
# This file covers every crate without a clippy.toml of its own. `domain` and
# `app` have one (they also ban impure calls), and clippy reads the nearest
# file only, so these three lines are repeated there; the architecture check
# makes sure they agree.
allow-unwrap-in-tests = true
allow-expect-in-tests = true
allow-panic-in-tests = true
