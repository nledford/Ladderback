# cargo-dist's configuration (technical design §12.1, §16 decision 54). It only
# builds: `.github/workflows/release-builds.yml` runs `dist build` for each
# target and smoke-tests the archive, and `.github/workflows/release.yml`
# attaches the Linux archives to each release, with a SHA256SUMS file. There
# is no `ci` key, so dist neither writes nor checks a workflow of its own, and
# `installers` is empty: dist hosts nothing itself.

[workspace]
members = ["cargo:."]

[dist]
cargo-dist-version = "0.34.0"
# Only the daemon is distributed: the `ladderback` package says `dist = true`
# in Cargo.toml, and every other package (the engine's test worker, `web`) is
# left out.
dist = false
targets = ["aarch64-apple-darwin", "aarch64-unknown-linux-gnu", "x86_64-unknown-linux-gnu"]
installers = []
# The Justfile's `release_flags`, which dist can't read: `just architecture`
# checks that the two agree.
default-features = false
# `cargo build --package ladderback`, not `--workspace`: the features are the
# daemon's alone, as `just architecture` checks them.
precise-builds = true
