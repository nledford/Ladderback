[package]
name = "l10n"
description = "Steading's localization: Fluent catalogs, generated message IDs, locale selection and the rendering of the API's error codes"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
build = "build.rs"

[features]
# `en-XA` and `ar-XB` (technical design §8.4), made from the en-US catalog by
# `fluent-pseudo`. They are a development tool and stay out of release builds.
# On by default so that this crate's own tests and mutation runs cover them;
# the workspace dependency turns defaults off, and `steading` and `web` pass
# the feature on through their own.
default = ["pseudo"]
pseudo = ["dep:fluent-pseudo"]

[dependencies]
api.workspace = true
fluent-bundle.workspace = true
fluent-langneg.workspace = true
fluent-pseudo = { workspace = true, optional = true }
jiff.workspace = true
unic-langid.workspace = true

[build-dependencies]
fluent-syntax.workspace = true
unic-langid.workspace = true

[dev-dependencies]
fluent-syntax.workspace = true
proc-macro2.workspace = true
serde_json.workspace = true

[lints]
workspace = true
