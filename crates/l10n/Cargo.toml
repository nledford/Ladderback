[package]
name = "l10n"
description = "Ladderback's localization: Fluent catalogs, generated message IDs, locale selection and the rendering of the API's error codes"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
build = "build.rs"

[features]
# `en-XA` and `ar-XB` (technical design §8.4), made from the en-US catalog by
# `fluent-pseudo`. They are a development tool and stay out of release builds.
# On by default so that this crate's own tests and mutation runs cover them;
# the workspace dependency turns defaults off, and `ladderback` and `web` pass
# the feature on through their own.
default = ["pseudo"]
pseudo = ["dep:fluent-pseudo"]
# ICU4X's formatting of numbers and instants (technical design §8.4). Only the
# daemon turns it on: a browser must never download the locale data, so `web`
# depends on `l10n` without it, and `scripts/check-architecture.sh` checks it.
icu = [
    "dep:fixed_decimal",
    "dep:icu_calendar",
    "dep:icu_datetime",
    "dep:icu_decimal",
    "dep:icu_locale_core",
    "dep:icu_provider",
    "dep:icu_time",
]
# The browser's `Intl` writes numbers and instants (technical design §8.4), for
# the web UI, on wasm32 only: the feature does nothing elsewhere, so a workspace
# build that unifies it with the daemon's `icu` still formats with ICU4X. No
# locale data ships to the browser. `web` is the one that turns it on.
browser-intl = ["dep:js-sys", "dep:wasm-bindgen"]

[dependencies]
api.workspace = true
fixed_decimal = { workspace = true, optional = true }
fluent-bundle.workspace = true
fluent-langneg.workspace = true
fluent-pseudo = { workspace = true, optional = true }
icu_calendar = { workspace = true, optional = true }
icu_datetime = { workspace = true, optional = true }
icu_decimal = { workspace = true, optional = true }
icu_locale_core = { workspace = true, optional = true }
icu_provider = { workspace = true, optional = true }
icu_time = { workspace = true, optional = true }
intl-memoizer.workspace = true
jiff.workspace = true
unic-langid.workspace = true

[target.'cfg(target_arch = "wasm32")'.dependencies]
js-sys = { workspace = true, optional = true }
wasm-bindgen = { workspace = true, optional = true }

[build-dependencies]
fluent-syntax.workspace = true
unic-langid.workspace = true

[dev-dependencies]
fluent-syntax.workspace = true
# The tests run with the daemon's formatting, as `app`'s run with its fakes.
l10n = { workspace = true, features = ["icu"] }
proc-macro2.workspace = true
serde_json.workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
spawn-gate.workspace = true

[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
wasm-bindgen-test.workspace = true

[lints]
workspace = true
