[package]
name = "testkit"
description = "Test support shared by the workspace's tests: visible test skips, a time limit on each cucumber scenario"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[dependencies]
spawn-gate.workspace = true

[target.'cfg(unix)'.dependencies]
# `pipe` makes a pipe that is not close-on-exec: `inheritable`.
nix.workspace = true

[dev-dependencies]
# A `SIGCHLD` handler, as tokio installs in a test process that starts a
# `tokio::process` child, and a listener with a short accept queue: `net`.
tokio = { workspace = true, features = ["net", "rt", "signal"] }

[target.'cfg(unix)'.dev-dependencies]
# `pthread` signals one thread: `net`'s test.
nix = { workspace = true, features = ["pthread"] }

[lints]
workspace = true
