# The inner rings take time, randomness and I/O only through ports
# (technical design §3.2). crates/app/clippy.toml must stay identical; CI
# checks that. Clippy flags only the paths listed, so the std::fs, std::env,
# std::process and std::net bans enumerate their impure items; pure helpers
# (path parsing, `env::split_paths`, socket address values) stay allowed.

# Production code never crashes (technical design §13.5): every crate root
# denies clippy::unwrap_used, expect_used, panic and friends. Tests may unwrap,
# expect and panic (todo!, unimplemented! and unreachable! stay denied there
# too). Clippy reads the nearest clippy.toml only, so the root
# clippy.toml, which covers the other crates, repeats these three lines.
allow-unwrap-in-tests = true
allow-expect-in-tests = true
allow-panic-in-tests = true

disallowed-methods = [
    { path = "std::time::SystemTime::now", reason = "use the Clock port" },
    { path = "std::time::Instant::now", reason = "use the Clock port" },
    { path = "jiff::Timestamp::now", reason = "use the Clock port", allow-invalid = true },
    { path = "jiff::Zoned::now", reason = "use the Clock port", allow-invalid = true },
    { path = "uuid::Uuid::now_v7", reason = "use the Random port", allow-invalid = true },
    { path = "uuid::Uuid::new_v4", reason = "use the Random port", allow-invalid = true },
    { path = "std::thread::sleep", reason = "use the Clock port" },
    # std::env: configuration comes from ports.
    { path = "std::env::var", reason = "configuration comes from ports" },
    { path = "std::env::var_os", reason = "configuration comes from ports" },
    { path = "std::env::vars", reason = "configuration comes from ports" },
    { path = "std::env::vars_os", reason = "configuration comes from ports" },
    { path = "std::env::args", reason = "configuration comes from ports" },
    { path = "std::env::args_os", reason = "configuration comes from ports" },
    { path = "std::env::set_var", reason = "no process state in the core" },
    { path = "std::env::remove_var", reason = "no process state in the core" },
    { path = "std::env::set_current_dir", reason = "no process state in the core" },
    { path = "std::env::current_dir", reason = "no I/O in the core" },
    { path = "std::env::current_exe", reason = "no I/O in the core" },
    { path = "std::env::home_dir", reason = "no I/O in the core" },
    { path = "std::env::temp_dir", reason = "no I/O in the core" },
    # std::process: no processes in the core.
    { path = "std::process::exit", reason = "no processes in the core" },
    { path = "std::process::abort", reason = "no processes in the core" },
    { path = "std::process::id", reason = "no processes in the core" },
    # std::fs: no I/O in the core.
    { path = "std::fs::read", reason = "no I/O in the core" },
    { path = "std::fs::read_to_string", reason = "no I/O in the core" },
    { path = "std::fs::write", reason = "no I/O in the core" },
    { path = "std::fs::read_dir", reason = "no I/O in the core" },
    { path = "std::fs::read_link", reason = "no I/O in the core" },
    { path = "std::fs::metadata", reason = "no I/O in the core" },
    { path = "std::fs::symlink_metadata", reason = "no I/O in the core" },
    { path = "std::fs::exists", reason = "no I/O in the core" },
    { path = "std::fs::create_dir", reason = "no I/O in the core" },
    { path = "std::fs::create_dir_all", reason = "no I/O in the core" },
    { path = "std::fs::remove_file", reason = "no I/O in the core" },
    { path = "std::fs::remove_dir", reason = "no I/O in the core" },
    { path = "std::fs::remove_dir_all", reason = "no I/O in the core" },
    { path = "std::fs::rename", reason = "no I/O in the core" },
    { path = "std::fs::copy", reason = "no I/O in the core" },
    { path = "std::fs::hard_link", reason = "no I/O in the core" },
    { path = "std::fs::canonicalize", reason = "no I/O in the core" },
    { path = "std::fs::set_permissions", reason = "no I/O in the core" },
    # std::path::Path methods that touch the file system (also hit through PathBuf).
    { path = "std::path::Path::exists", reason = "no I/O in the core" },
    { path = "std::path::Path::try_exists", reason = "no I/O in the core" },
    { path = "std::path::Path::is_file", reason = "no I/O in the core" },
    { path = "std::path::Path::is_dir", reason = "no I/O in the core" },
    { path = "std::path::Path::is_symlink", reason = "no I/O in the core" },
    { path = "std::path::Path::metadata", reason = "no I/O in the core" },
    { path = "std::path::Path::symlink_metadata", reason = "no I/O in the core" },
    { path = "std::path::Path::read_dir", reason = "no I/O in the core" },
    { path = "std::path::Path::read_link", reason = "no I/O in the core" },
    { path = "std::path::Path::canonicalize", reason = "no I/O in the core" },
]
disallowed-types = [
    { path = "std::fs::File", reason = "no I/O in the core" },
    { path = "std::fs::OpenOptions", reason = "no I/O in the core" },
    { path = "std::fs::DirEntry", reason = "no I/O in the core" },
    { path = "std::process::Command", reason = "no processes in the core" },
    { path = "std::process::Child", reason = "no processes in the core" },
    { path = "std::process::Stdio", reason = "no processes in the core" },
    { path = "std::process::ExitStatus", reason = "no processes in the core" },
    { path = "std::process::Output", reason = "no processes in the core" },
    { path = "std::net::TcpStream", reason = "no I/O in the core" },
    { path = "std::net::TcpListener", reason = "no I/O in the core" },
    { path = "std::net::UdpSocket", reason = "no I/O in the core" },
    { path = "std::time::SystemTime", reason = "use the Clock port" },
    { path = "std::time::Instant", reason = "use the Clock port" },
]
