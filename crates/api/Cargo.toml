[package]
name = "api"
description = "Wire types shared by the daemon, the hub, the worker and the web UI (the published language)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[features]
# JSON schemas of the types the MCP server's tools return, for their output
# schemas (§4.6). Only `adapters/mcp` turns it on.
schemars = ["dep:schemars"]

[dependencies]
jiff.workspace = true
schemars = { workspace = true, optional = true }
serde.workspace = true
serde_json.workspace = true

[dev-dependencies]
# The tests check the schemas the `schemars` feature writes.
api = { workspace = true, features = ["schemars"] }

[lints]
workspace = true
