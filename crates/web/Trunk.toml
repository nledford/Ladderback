# Trunk's build for the web UI (technical design §4.4, §4.5): Tailwind runs as
# a pre-build hook, compiling tailwind.css into tw-out.css before trunk
# collects the stylesheets index.html names. The npm packages are pinned by
# package-lock.json; scripts/web-packages.sh installs them again whenever the
# lockfile differs from the one node_modules was installed from, and stops the
# build when npm is missing. The arguments key is `command_arguments`: trunk
# ignores any other name without a word, and a bare `sh` then waits for
# commands on the terminal. crates/web/tests/trunk_hook.rs runs this hook.

[[hooks]]
stage = "pre_build"
command = "sh"
command_arguments = [
  "-c",
  "sh ../../scripts/web-packages.sh && npx --no-install tailwindcss -i tailwind.css -o tw-out.css --minify",
]
