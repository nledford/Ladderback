<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="light dark">
    <title>Ladderback</title>
    <link data-trunk rel="css" href="style.css">
    <!-- Tailwind's output (tailwind.css), compiled by the pre-build hook of
         Trunk.toml; its colors are the tokens of style.css. -->
    <link data-trunk rel="css" href="tw-out.css">
    <link data-trunk rel="rust" data-wasm-opt="z">
  </head>
  <body>
    <noscript>Ladderback's web UI needs JavaScript and WebAssembly.</noscript>
    <!-- The announcer's two regions (technical design §4.5): outside the mount
         point, so they exist, empty, before anything is written to them. -->
    <div id="live-polite" class="live-region" role="status" aria-live="polite" aria-atomic="true"></div>
    <div id="live-assertive" class="live-region" role="alert" aria-live="assertive" aria-atomic="true"></div>
    <div id="app"></div>
  </body>
</html>
