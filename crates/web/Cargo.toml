[package]
name = "web"
description = "Ladderback's web UI: a Leptos client-side app built with trunk"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[features]
# The development pseudolocales `en-XA` and `ar-XB`, which a page asks for with
# `?locale=` (technical design §8.4). They bring `fluent-pseudo` and its regex
# engine along, so a release build passes `--no-default-features` (`trunk build
# --release --no-default-features`), and `just architecture` checks that this
# leaves them out.
default = ["pseudo"]
pseudo = ["l10n/pseudo"]
# The component gallery, the dev-only route `/_gallery` where Playwright drives
# the shared components (technical design §4.5). Off by default and off in a
# release build; `just test-ui` builds the UI with it on.
gallery = []

[dependencies]
api.workspace = true
console_error_panic_hook.workspace = true
# The REST client of the live pages (§4.4): `fetch` with typed JSON bodies,
# and the events WebSocket.
gloo-net = { workspace = true, features = ["websocket"] }
# Driving the events WebSocket's message stream needs the `Stream` trait in
# scope, and waiting between reconnects and settle-poll reads is the
# browser's own time (§4.4).
futures.workspace = true
gloo-timers.workspace = true
# The live pages' request bodies and typed refusals cross as JSON (§4.4).
serde.workspace = true
serde_json.workspace = true
# The live pages' instants are parsed RFC 3339 and handed to the catalog as
# timestamps (§8.4); `jiff` only, never `chrono` (decision 22).
jiff.workspace = true
# The browser's `Intl` writes the page's numbers and instants (technical design
# §8.4); no locale data ships. The feature is on whatever the build, so there
# is no `web` feature for it.
l10n = { workspace = true, features = ["browser-intl"] }
leptos.workspace = true
leptos_router.workspace = true
web-sys.workspace = true

[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
api.workspace = true
wasm-bindgen-test.workspace = true

[lints]
workspace = true
