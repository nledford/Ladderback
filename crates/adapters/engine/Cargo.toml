[package]
name = "engine"
description = "Engine adapter: the worker process, its job protocol and the daemon-side client"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
api.workspace = true
app.workspace = true
domain.workspace = true
spawn-gate.workspace = true
async-trait.workspace = true
bytes.workspace = true
futures.workspace = true
jiff.workspace = true
log.workspace = true
rustic_backend.workspace = true
rustic_core.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["process", "io-util", "rt", "macros", "time", "sync"] }

# Signals and process groups: the daemon stops a worker with SIGTERM, which the
# worker handles, and kills its whole process group; the worker also points its file
# descriptor 1 elsewhere and, on Linux, asks to be told when its parent dies.
# Ladderback targets macOS and Linux (technical design §1); elsewhere a stop kills at once.
[target.'cfg(unix)'.dependencies]
nix = { workspace = true, features = ["fs"] }
signal-hook.workspace = true

[dev-dependencies]
app = { workspace = true, features = ["fakes"] }
# The Basic credentials an `rclone:` repository is read with (tests/retention.rs).
base64.workspace = true
tempfile.workspace = true
testkit.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }

[lints]
workspace = true
