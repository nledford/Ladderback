[package]
name = "tls-adapter"
description = "TLS adapter: the hub's built-in TLS 1.3 listener, its self-signed certificate, the agent's pinned verifier and the session's exporter"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
app.workspace = true
domain.workspace = true
rcgen.workspace = true
rustls.workspace = true
tokio.workspace = true
tokio-rustls.workspace = true

[dev-dependencies]
app = { workspace = true, features = ["fakes"] }
# A TLS 1.2 peer, which only the tests build, to show it is refused.
rustls = { workspace = true, features = ["tls12"] }
tokio = { workspace = true, features = ["io-util", "macros", "rt"] }

[lints]
workspace = true
