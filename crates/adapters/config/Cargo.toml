shell-words.workspace = true
tempfile.workspace = true
tokio = { workspace = true, features = ["rt", "sync"] }
toml.workspace = true
toml_edit.workspace = true

[dev-dependencies]
app = { workspace = true, features = ["fakes"] }
rustic_core.workspace = true
tempfile.workspace = true
testkit.workspace = true
