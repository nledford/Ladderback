[package]
name = "notify-adapter"
description = "Notifications adapter: delivers rendered notifications to webhooks, ntfy and healthchecks pings"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
api.workspace = true
app.workspace = true
domain.workspace = true
l10n.workspace = true
async-trait.workspace = true
reqwest.workspace = true
serde_json.workspace = true

[dev-dependencies]
app = { workspace = true, features = ["fakes"] }
base64.workspace = true
# The pseudolocales, so a test can tell a message in another locale apart, and
# the daemon's formatting of instants, so a test reads the text the daemon sends.
l10n = { workspace = true, features = ["icu", "pseudo"] }
tokio = { workspace = true, features = ["io-util", "macros", "net", "rt-multi-thread", "time"] }

[lints]
workspace = true
