[package]
name = "platform"
description = "Platform adapter: system clock, power source, network state, agent ID, folders and the user's service manager"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
hostname = "0.4"
app.workspace = true
domain.workspace = true
async-trait.workspace = true
argon2.workspace = true
# The admin password's fingerprint: the SHA-256 of its hash's salt (decision 93).
sha2.workspace = true
# The manager's command line as a person would type it, in a refusal.
shell-words.workspace = true
# The Wi-Fi report of `system_profiler -json` on macOS (decision 80).
serde_json.workspace = true
# The hub's TLS key file is PEM: base64 of its PKCS#8 encoding (decision 120).
base64.workspace = true
spawn-gate.workspace = true
# `macros`: `tokio::join!` reads a child's stdout and stderr at once.
tokio = { workspace = true, features = ["io-util", "macros", "process", "rt", "sync", "time"] }
uuid = { workspace = true, features = ["v7"] }
# Key files are read into buffers wiped when dropped (I4).
zeroize.workspace = true

[target.'cfg(unix)'.dependencies]
# `term`: the password prompt turns echo off. `user`: the user's ID, as a
# launchd agent lives in the `gui/<uid>` domain. `resource` and `process`:
# the core-dump limit and, on Linux, the dumpable flag (decision 98).
nix = { workspace = true, features = ["process", "resource", "term", "user"] }
# A signal that ends the process while the password prompt has echo off
# puts the terminal's settings back first (#399).
signal-hook.workspace = true

# The Wi-Fi network's name from NetworkManager (decision 80). `vendored`
# builds libdbus from source, as `secrets` does, so a bare toolchain image
# builds it.
[target.'cfg(target_os = "linux")'.dependencies]
dbus = { workspace = true, features = ["vendored"] }

[dev-dependencies]
app = { workspace = true, features = ["fakes"] }
tempfile.workspace = true
testkit.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "time"] }

[target.'cfg(unix)'.dev-dependencies]
# A umask, for a test of the service file's mode.
nix = { workspace = true, features = ["fs", "user"] }

[lints]
workspace = true
