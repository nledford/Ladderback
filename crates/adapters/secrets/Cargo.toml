[package]
name = "secrets"
description = "Secrets adapter: command, keyring, file and environment secret sources"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
app.workspace = true
domain.workspace = true
async-trait.workspace = true
tokio = { workspace = true, features = ["io-util", "process", "rt", "time"] }

[target.'cfg(unix)'.dependencies]
# `signal` kills a command's process group, `fs` opens a file without
# blocking on a FIFO.
nix = { workspace = true, features = ["fs", "signal"] }

# The OS keyring. Without a platform feature the `keyring` crate silently
# falls back to an in-memory mock store, so every platform without a real
# store here is compiled with an "unavailable" store instead (`keyring_store`).
[target.'cfg(target_os = "macos")'.dependencies]
keyring = { workspace = true, features = ["apple-native"] }

# Linux: the Secret Service over D-Bus, through `dbus-secret-service`.
# `vendored` builds libdbus from source and `crypto-rust` does the session
# encryption in Rust, so a bare toolchain image with no apt packages (no
# libdbus-dev, no libssl-dev) builds it. The kernel keyutils store
# (`linux-native`) is left out: it is session memory, not a place a user keeps
# a repository password.
[target.'cfg(target_os = "linux")'.dependencies]
keyring = { workspace = true, features = ["sync-secret-service", "crypto-rust", "vendored"] }

[dev-dependencies]
app = { workspace = true, features = ["fakes"] }
tempfile.workspace = true
testkit.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "time"] }

[lints]
workspace = true
