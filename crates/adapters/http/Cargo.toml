[package]
name = "http-adapter"
description = "HTTP adapter: serves the embedded web UI"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lib]
name = "http_adapter"

[features]
# The hub's way in (§16, decision 122): the agent routes under `/sync/`, with
# a router and a check of their own (security §10.1). On by default for this
# crate's own tests; the workspace dependency turns it off, `ladderback`'s
# `hub` on, and a release build leaves it out.
default = ["hub"]
hub = []

[dependencies]
app.workspace = true
async-trait.workspace = true
api.workspace = true
axum.workspace = true
base64.workspace = true
domain.workspace = true
futures.workspace = true
http-body-util.workspace = true
hyper.workspace = true
hyper-util.workspace = true
log.workspace = true
serde_json.workspace = true
mime_guess.workspace = true
rust-embed.workspace = true
serde.workspace = true
sha2.workspace = true
# Every accept holds the spawn gate (decision 66).
spawn-gate.workspace = true
tokio = { workspace = true, features = ["macros", "net", "rt", "sync", "time"] }
# `util`: the serve loop hands each request its peer (`map_request`).
tower = { workspace = true, features = ["util"] }
# `CatchPanicLayer`: a handler's panic is answered 500, not a dropped
# connection.
tower-http.workspace = true

[dev-dependencies]
app = { workspace = true, features = ["fakes"] }
serde_json.workspace = true
tempfile.workspace = true
testkit.workspace = true
# `test-util`: the hub's 90-second silence bound, waited out on a paused
# clock (§16, decision 159).
tokio = { workspace = true, features = ["macros", "net", "rt-multi-thread", "test-util", "time"] }
tokio-tungstenite = { workspace = true }
uuid.workspace = true

[target.'cfg(unix)'.dev-dependencies]
# `dup` makes a descriptor that is not close-on-exec: the listener's tests.
nix = { workspace = true, features = ["fs"] }

[lints]
workspace = true
