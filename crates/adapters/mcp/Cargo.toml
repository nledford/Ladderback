[package]
name = "mcp"
description = "MCP server adapter: `ladderback mcp`, the Model Context Protocol over stdio for AI agents and scripts"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
api.workspace = true
async-trait.workspace = true
# Connect mode's client of the daemon's API (§4.6): no defaults, rustls for an
# `https` daemon.
reqwest.workspace = true
rmcp.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["io-std"] }

[dev-dependencies]
# A stand-in daemon for the connect backend's tests: the API's routes, never
# `adapters/http` (§3.2).
axum.workspace = true
tokio = { workspace = true, features = ["io-util", "macros", "net", "rt-multi-thread", "test-util"] }

[lints]
workspace = true
