[package]
name = "store"
description = "Store adapter: the SQLite database behind the operation log and history"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[features]
# The hub's registry of agents and pairing tokens (`AgentRegistry`; §16,
# decisions 120 and 122). Its tables' migration ships in every build. On by
# default for this crate's own tests; the workspace dependency turns it off,
# `ladderback`'s `hub` on, and a release build leaves it out.
default = ["hub"]
hub = []

[dependencies]
api.workspace = true
app.workspace = true
domain.workspace = true
async-trait.workspace = true
serde.workspace = true
serde_json.workspace = true
sqlx.workspace = true
tokio = { workspace = true, features = ["sync"] }

[dev-dependencies]
app = { workspace = true, features = ["fakes"] }
tempfile.workspace = true
testkit.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "sync", "time"] }

[lints]
workspace = true
